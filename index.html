<body>
<header class="top">
  <div class="bar">
    <h1 class="brand"><span class="hello" id="hello"></span><span id="shopname">Rate Book</span><span class="envbadge" id="envbadge" hidden>TEST</span><small id="count" class="num"></small></h1>

      <button class="iconbtn" id="cmd-open" aria-label="Change by typing or speaking"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 20 10-10M15 4v3M13.5 5.5h3M19 9v2M18 10h2M8 4v2M7 5h2"/></svg></button>
      <div class="lang" role="group" aria-label="Language">
        <button id="lang-en" aria-pressed="true">EN</button>
        <button id="lang-hi" aria-pressed="false">हि</button>
      </div>
    </div>
  </div>
  <div class="search" id="searchbox">
    <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" data-tp="searchPh" placeholder="Search item…">
    <button class="iconbtn clear" id="q-clear" hidden aria-label="Clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <button class="iconbtn" id="mic" aria-label="Speak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  </div>
  <div class="mictip" id="mictip" hidden>
    <div class="kb" aria-hidden="true"><i></i><i></i><i></i><i class="m"></i><i></i><i></i><i></i><i></i></div>

  </div>
</header>

<main>
  <div class="svnote" id="sv-note" hidden></div>
  <div class="queuebar" id="queuebar" hidden></div>
  <div class="netbar" id="netbar" hidden><span class="dot"></span><span id="net-txt"></span><button id="net-refresh" data-t="refresh">Refresh</button></div>
  <div id="install-wrap"></div>
  <section id="view-items">
    <div class="codenote" id="code-note" hidden></div>
    <div class="ro lockline" id="ro-note" hidden><span data-t="readOnly2">View only. Unlock editing to change prices.</span><button class="btn ghost" data-act="unlock" data-t="unlockBtn">Unlock</button><button type="button" class="x" id="ro-x" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div id="setup-wrap"></div>
    <div id="cmdhint-wrap"></div>
    <div class="addto" id="addto" role="button" tabindex="0" hidden></div>
    <div class="fchips" id="fchips" role="group" aria-label="Filter"></div>
    <div class="meta"><span id="meta-l"></span><span id="meta-r"></span></div>
    <div id="suggest"></div>
    <div class="list" id="list">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </div>
    <div id="list-more"></div>
  </section>

  <section id="view-bill" hidden>
    <div class="editbar movebar" id="movebar" hidden><span id="movebar-t"></span><button type="button" class="btn ghost" id="move-stop" data-t="moveStop">Stop</button></div>
    <div class="editbar" id="editbar" hidden><span id="editbar-t"></span><button type="button" class="btn ghost" id="edit-cancel" data-t="cancelEdit">Cancel editing</button></div>
    <div id="bill-search-results" class="mini-results"></div>
    <div class="heldrow" id="heldrow" hidden role="tablist" aria-label="Open bills"></div>
    <div class="billhead" id="billhead">
      <div class="bh-row">
        <button type="button" class="bh-no" id="bh-no-btn"><span data-t="billNoL">Bill No.</span><b class="num" id="bh-no">1</b><i id="bh-manual" hidden></i></button>
        <div class="bh-chips">
          <button type="button" class="chip-t" id="gst-chip" aria-pressed="false">GST</button>
          <button type="button" class="chip-t soft" id="igst-chip" aria-pressed="false" hidden>CGST+SGST</button>
          <button type="button" class="iconbtn sm" id="bh-more" aria-expanded="false" aria-label="More bill details"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        </div>
      </div>
      <div class="bh-cust">
        <input id="cust" name="rb-cust-x" autocomplete="rb-cust-name" autocorrect="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-controls="sug-cust" aria-expanded="false" enterkeyhint="next" data-tp="custName" placeholder="Customer name" aria-label="Customer name">
        <div class="bh-mob">
          <input id="cust-mob" name="rb-mob-x" type="text" inputmode="tel" autocomplete="rb-cust-mob" role="combobox" aria-autocomplete="list" aria-controls="sug-cust" aria-expanded="false" maxlength="20" data-tp="custMob" placeholder="Mobile no." aria-label="Mobile no.">
          <button type="button" class="cust-x" id="cust-x" hidden aria-label="Clear customer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
      </div>
      <div class="sugbox" id="sug-cust" role="listbox" hidden></div>
      <span class="err" id="mob-err"></span>
      <div class="custhint" id="cust-hint" hidden></div>
      <div class="paybar" id="paybar">
        <div class="seg" id="pay-seg" role="radiogroup" aria-label="Payment">
          <button type="button" role="radio" data-pay="paid" data-t="payPaid">Paid</button>
          <button type="button" role="radio" data-pay="credit" data-t="payCredit">Credit</button>
          <button type="button" role="radio" data-pay="part" data-t="payPart">Part paid</button>
        </div>
        <div class="pay-part" id="pay-part" hidden><label for="pay-recv" data-t="recvL">Received ₹</label><input id="pay-recv" class="num" inputmode="decimal" autocomplete="off"><span class="pay-due num" id="pay-due"></span></div>

          <button type="button" class="pm" data-pm="cash" aria-pressed="false"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/></svg><span data-t="pmCash">Cash</span></button>
          <button type="button" class="pm" data-pm="upi" aria-pressed="false"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18h3"/><path d="m10 8.5 2 4 2-4"/></svg><span data-t="pmUpi">UPI</span></button>
          <button type="button" class="pm" data-pm="cheque" aria-pressed="false"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M6 10h7M6 14h4M15 14.5l3-3"/></svg><span data-t="pmCheque">Cheque</span></button>
        </div>
      </div>
      <div id="bh-extra" hidden>
        <div class="bh-field"><label for="bill-no"><span data-t="billNoL">Bill No.</span> <span class="auto" id="bill-auto" hidden></span></label><input id="bill-no" class="num" inputmode="numeric" autocomplete="off" aria-label="Bill No." style="width:110px;text-align:right;font:700 22px/1 var(--f-display);color:var(--accent);border:1.5px dashed var(--line);background:none;border-radius:var(--r-sm);padding:4px 8px"></div>
        <div class="bh-field" id="igst-row" hidden><label for="igst-on" data-t="outState">Out of state (IGST)</label><label class="switch" style="flex:none"><input type="checkbox" id="igst-on"></label></div>
        <div class="field" id="pos-wrap" hidden><label for="pos-sel" data-t="posPick">Customer's state (place of supply)</label><select id="pos-sel"></select></div>
        <div class="field" id="cgstin-wrap" hidden><label for="cust-gstin" data-t="custGstin">Customer GSTIN (optional)</label><input id="cust-gstin" name="rb-gstin-x" autocomplete="rb-cust-gstin" autocorrect="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-controls="sug-gstin" aria-expanded="false" maxlength="15" style="text-transform:uppercase"><div class="sugbox" id="sug-gstin" role="listbox" hidden></div><span class="err" id="gstin-err"></span></div>
        <div class="bh-field po-row" id="po-wrap"><div class="po-head"><label for="po-no" data-t="poRowL">Customer PO</label><button type="button" class="po-x" id="po-x" hidden aria-label="Remove PO"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg><span data-t="poRemoveS">Remove</span></button></div>

            <span class="po-nw"><input id="po-no" name="rb-po-x" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="40" enterkeyhint="done" data-tp="poNoL" placeholder="PO number" aria-label="PO number"></span>
            <span class="po-dc" id="po-dc"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="po-dl" data-t="poDateShort">Date</span><input type="date" id="po-date" aria-label="PO date"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="envnote" id="bill-envnote" hidden></div>
    <div class="lastbill" id="lastbill" hidden></div>
    <div class="bi-head"><div class="bi-t"><h2 class="section-title" data-t="billItems">Bill items</h2><span class="bi-n num" id="bill-n" hidden></span></div><button type="button" class="chip-t newb" id="bill-new" hidden><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-t="newBillChip">New bill</span></button></div>
    <div class="list" id="bill-lines"></div>
    <div class="total" id="bill-total" hidden>
      <div class="tot-row">
        <div class="tot-sum"><div class="ts1"><span id="sum-label">Total</span><b class="num" id="bill-sum">₹0</b></div><div class="ts2"><span class="duechip num" id="bill-duechip" hidden></span><button type="button" class="profit num" id="bill-profit" hidden></button><button type="button" class="cash-open" id="cash-open" hidden aria-expanded="false"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg><span data-t="cashOpen">Cash given?</span></button></div></div>
        <a class="btn wa sm" id="bill-wa" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg><span id="wa-label">Share</span></a>
        <button class="btn primary sm" id="bill-done">Done</button>
        <button type="button" class="iconbtn sm" id="tot-more" aria-expanded="false" aria-label="More options"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></button>
        <button type="button" class="iconbtn tot-find" id="tot-find" aria-label="Find an item to add"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      </div>
      <div class="cashrow" id="cashrow" hidden>
        <label class="cash-in"><span data-t="cashGiven">Cash given</span><span class="rs">₹</span><input id="cash-in" class="num" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-label="Cash given"></label>
        <div class="cash-chips" id="cash-chips"></div>
        <div class="cash-res" id="cash-res" hidden></div>
      </div>
      <div id="tot-extra" hidden>
        <div class="gstsum num" id="gst-sum" hidden></div>
        <div id="bill-pbox"></div>
        <div class="acts">
          <button class="btn ghost" id="bill-copy" data-t="copy">Copy</button>
          <button class="btn ghost" id="bill-pdf" data-t="pdfBtn">PDF</button>
          <button class="btn ghost" id="bill-print" data-t="printBtn">Print</button>
          <button class="btn ghost" id="bill-clear" data-t="clear">Clear</button>
        </div>
      <div class="confirm" id="bill-clear-confirm" hidden>
        <span data-t="clearQ">Remove all items from this bill?</span>
        <div class="acts"><button class="btn danger" id="bill-clear-yes" data-t="yesClear">Yes, clear</button><button class="btn ghost" id="bill-clear-no" data-t="cancel">Cancel</button></div>
      </div>
      </div>
    </div>

    <div class="menu-list tl-daily">
      <button id="t-bills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2z"/><path d="M9 7h6M9 11h6"/><circle cx="17" cy="17" r="4" fill="var(--surface)"/><path d="m20 20 2 2"/></svg><div><b data-t="pastBills">Past bills</b><span data-t="pastBillsD">Find a bill and send it again</span></div></button>
      <button id="t-dues"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h12a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2-2-1.3V4z"/><path d="M8 9h6M8 13h4"/><circle cx="18" cy="7" r="4" fill="var(--surface)"/><path d="M18 5.2v3.6M16.6 6h2.3a.7.7 0 0 1 0 1.4h-1.8a.7.7 0 0 0 0 1.4h2.3"/></svg><div><b data-t="duesT">Credit (Udhaar)</b><span id="t-dues-sub" data-t="duesD">Who owes money, and record payments</span></div></button>
      <button id="t-custs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 20a6 6 0 0 0-2.5-4.9"/></svg><div><b data-t="cuT">Customers</b><span data-t="cuToolD">Everyone who bought, their details and bills</span></div></button>
      <button id="t-vendors" data-w><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M3 9h18M9 20v-6h6v6"/></svg><div><b data-t="vTitle">Vendors</b><span data-t="vToolD">Bills from suppliers, payments, what you owe</span></div></button>
      <button id="t-reports" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><div><b data-t="repT">Reports</b><span data-t="repD">Sales, top items, GST summary and files for your CA</span></div></button>
      <button id="t-sum" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.5A8.4 8.4 0 1 1 21 11.5z"/><path d="M9 10h6M9 13.5h4"/></svg><div><b data-t="smT">Today's summary</b><span data-t="smD">Today's sales, profit, money in, credit and what to do, ready to send on WhatsApp</span></div></button>
      <button id="t-biz" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><div><b data-t="bizT">Business dashboard</b><span data-t="bizD">What to do today, margins, credit and what to reorder. Opens in the browser.</span></div></button>
    </div>
    <h3 class="tl-h" data-t="tlItems">Prices &amp; items</h3>
    <div class="menu-list">
      <button id="t-cmd" data-w><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 20 10-10M15 4v3M13.5 5.5h3M19 9v2M18 10h2M8 4v2M7 5h2"/></svg><div><b data-t="cmdTitle">Change by typing or speaking</b><span data-t="cmdD">"add 51 micron bag 1kg rates 110 and 120"</span></div></button>
      <button id="t-add" data-w><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><div><b data-t="addItem">Add item</b><span data-t="addItemD">One item with photo</span></div></button>

  :root:not([data-theme="light"])[data-palette="forest"]{--ink:#5CC594;--ink-fg:#06261A;--ink-soft:#173327;--accent:#5CC594;--accent-fg:#06261A;--accent-soft:#173327;--bg:#0C110F;--surface-2:#1E2522}
  :root:not([data-theme="light"])[data-palette="indigo"]{--ink:#9AABFF;--ink-fg:#0B1240;--ink-soft:#1D2346;--accent:#9AABFF;--accent-fg:#0B1240;--accent-soft:#1D2346;--bg:#0D0F16;--surface-2:#1F2230}
  :root:not([data-theme="light"])[data-palette="saffron"]{--ink:#F5A524;--ink-fg:#2B1600;--ink-soft:#3A2810;--accent:#F5A524;--accent-fg:#2B1600;--accent-soft:#3A2810;--bg:#110E0A;--surface-2:#26211A}
}
:root[data-theme="dark"]{--ink-soft:#2A2C31}
:root[data-theme="dark"][data-palette="maroon"]{--ink:#EC8E99;--ink-fg:#2A0A10;--ink-soft:#3A1E24;--accent:#EC8E99;--accent-fg:#2A0A10;--accent-soft:#3A1E24;--bg:#110D0E;--surface-2:#251F21}
:root[data-theme="dark"][data-palette="forest"]{--ink:#5CC594;--ink-fg:#06261A;--ink-soft:#173327;--accent:#5CC594;--accent-fg:#06261A;--accent-soft:#173327;--bg:#0C110F;--surface-2:#1E2522}
:root[data-theme="dark"][data-palette="indigo"]{--ink:#9AABFF;--ink-fg:#0B1240;--ink-soft:#1D2346;--accent:#9AABFF;--accent-fg:#0B1240;--accent-soft:#1D2346;--bg:#0D0F16;--surface-2:#1F2230}
:root[data-theme="dark"][data-palette="saffron"]{--ink:#F5A524;--ink-fg:#2B1600;--ink-soft:#3A2810;--accent:#F5A524;--accent-fg:#2B1600;--accent-soft:#3A2810;--bg:#110E0A;--surface-2:#26211A}
:root{--nav-bg:var(--ink);--nav-fg:color-mix(in srgb,var(--ink-fg) 62%,transparent);--nav-act-bg:var(--ink-fg);--nav-act-fg:var(--ink);--toast-bg:var(--ink);--toast-fg:var(--ink-fg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-palette]{--nav-bg:#212328;--nav-fg:#A3A7AF;--nav-act-bg:var(--ink);--nav-act-fg:var(--ink-fg);--toast-bg:#2A2C31;--toast-fg:#F3F4F6}}
:root[data-theme="dark"][data-palette]{--nav-bg:#212328;--nav-fg:#A3A7AF;--nav-act-bg:var(--ink);--nav-act-fg:var(--ink-fg);--toast-bg:#2A2C31;--toast-fg:#F3F4F6}
@media (max-width:1023px){
  .tabs{background:var(--nav-bg)}
  .tabs button{color:var(--nav-fg)}
  .tabs button[aria-selected="true"]{background:var(--nav-act-bg);color:var(--nav-act-fg)}
  .tabs .badge{box-shadow:0 0 0 2px var(--nav-bg)}
}
.toast{background:var(--toast-bg);color:var(--toast-fg)}
.editbar.fresh{background:color-mix(in srgb,var(--good) 12%,var(--surface));color:var(--fg);border-color:var(--good)}
.svnote{display:grid;gap:4px;font-size:13px;background:color-mix(in srgb,var(--danger) 10%,var(--surface));color:var(--fg);border:1.5px solid color-mix(in srgb,var(--danger) 40%,transparent);border-radius:14px;padding:10px 12px;margin:4px 0}
.svnote b{color:var(--danger)}
.queuebar{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:999px;padding:6px 8px 6px 12px;margin:4px 0}
.queuebar .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none}
.queuebar.bad{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.queuebar.bad .dot{background:var(--danger)}
.queuebar button{margin-left:auto;border:0;background:var(--ink);color:var(--ink-fg);border-radius:999px;padding:5px 12px;font:700 12px var(--f-body)}
.codenote{display:grid;gap:6px;background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);margin:4px 0 10px}
.codeline{display:flex;gap:8px}.codeline input{flex:1;min-width:0;border:0;background:var(--surface-2);border-radius:12px;padding:10px 12px;font:700 16px var(--f-body);letter-spacing:.12em;text-transform:uppercase}
.billcard.cancelled b,.billcard.cancelled .amt{text-decoration:line-through;opacity:.6}
.pill.cancel{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}
.cancelnote{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);font-weight:600;border-radius:14px;padding:10px 12px;font-size:14px}
#bill-auto .warn{color:var(--danger);font-weight:700}
.rp{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.rp>*,#rp-body>*{min-width:0}
#rp-body{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.rp-custom{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.rp-custom input{border:0;background:var(--surface-2);border-radius:12px;padding:8px 10px;color:var(--fg)}
.rp-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.rp-stat{background:var(--surface-2);border-radius:16px;padding:10px 12px;display:grid;gap:2px}
.rp-stat span{font-size:12px;color:var(--muted)}
.rp-stat b{font:800 18px var(--f-display);letter-spacing:-.02em}
.rp-stat.big{grid-column:1/-1;background:var(--ink);color:var(--ink-fg)}
.rp-stat.big span{color:var(--ink-fg);opacity:.75}.rp-stat.big b{font-size:28px}
.rp-stat.good b{color:var(--good)}.rp-stat.warn b{color:var(--danger)}
.rp-h{margin:6px 0 0;font:800 16px var(--f-display)}
.rp-sub{margin:4px 0 0;font-size:13px;font-weight:700;color:var(--muted)}
.rp-chart{width:100%;height:auto;display:block}
.rp-chart rect{fill:var(--ink)}
.rp-chart rect.zero{fill:var(--line)}
.rp-chart text{font:600 8px var(--f-body);fill:var(--muted);text-anchor:middle}
/* Reports summary card: numbers roll, the split bar and per-day bars move to the new period, rows fade in/out (9 Oct 2026) */
.rph{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:14px 14px 12px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.rph-main{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);transition:opacity .25s}
.rph.busy .rph-main{opacity:.55}
.rph-top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:18px}
.rph-per{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.01em}
.rph-spin{display:none}.rph.busy .rph-spin{display:inline-block}
.rph-big{font:800 32px/1.05 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rph-sub{font-size:13px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.rph-sub b{color:var(--fg)}
.rph-bar{position:relative;display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.rph-seg{--o:1;height:100%;width:0;flex:none;background:var(--ink);opacity:var(--o);border-right:2px solid var(--surface);cursor:pointer;transition:width .65s cubic-bezier(.2,.8,.2,1),opacity .25s}
.rph-seg:last-child{border-right:0}
.rph.hl .rph-seg:not(.on){opacity:calc(var(--o) * .22)}
.rph-rows{display:grid;grid-template-columns:minmax(0,1fr)}
.rph-rw{display:grid;grid-template-rows:1fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1),opacity .3s,transform .45s cubic-bezier(.2,.8,.2,1)}
.rph-rw>div{overflow:hidden;min-height:0}
.rph-rw.out{grid-template-rows:0fr;opacity:0}
.rph-row{--o:1;display:grid;grid-template-columns:10px minmax(0,1fr) auto 40px;gap:8px;align-items:center;padding:6px 6px;border-radius:10px;font-size:14px;cursor:pointer;transition:opacity .25s,background .2s}
.rph-row .dot{width:9px;height:9px;border-radius:3px;background:var(--ink);opacity:var(--o)}
.rph-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rph-row b{font-weight:800;font-variant-numeric:tabular-nums}
.rph-row .pc{text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.rph.hl .rph-row:not(.on){opacity:.4}
.rph-row.on{background:var(--surface-2)}
.rph-lbl{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.rph-lbl b{color:var(--fg);font-variant-numeric:tabular-nums}
.rph-days{display:flex;align-items:flex-end;gap:3px;height:56px;margin-top:6px}
.rph-d{--h:0;flex:1 1 0;min-width:0;height:max(2px,calc(var(--h) * 1%));background:var(--ink);opacity:.2;border-radius:3px 3px 1px 1px;cursor:pointer;transition:height .55s cubic-bezier(.2,.8,.2,1) var(--dl,0s),opacity .2s}
.rph-d.z{opacity:.08}
.rph-d.on{opacity:.85}
.rph-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.rph-meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-top:1px solid var(--line);padding-top:10px}
.rph-m span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rph-m b{font:800 15px var(--f-display);font-variant-numeric:tabular-nums}
.rph-m.warn b{color:var(--danger)}
.rph-m i{display:block;height:3px;border-radius:2px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.rph-m i::after{content:"";display:block;height:100%;width:calc(var(--p,0) * 1%);background:var(--ink);opacity:.55;transition:width .65s cubic-bezier(.2,.8,.2,1)}
.rph-m.warn i::after{background:var(--danger)}
.rph-tip{position:absolute;z-index:3;pointer-events:none;background:var(--ink);color:var(--ink-fg);font-size:12px;font-weight:600;padding:6px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .15s,left .2s,top .2s;font-variant-numeric:tabular-nums}
.rph-tip.show{opacity:1}
.rph-empty{font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){.rph *,.rph{transition:none!important}}
.rp-items{display:grid;gap:6px}
.rp-pbtn{text-align:left;cursor:pointer;font:inherit;color:inherit;border:0;width:100%}
.rp-pbtn i{font-style:normal;opacity:.6}
.rp-pdet{display:grid;gap:6px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;animation:rpdet .2s ease-out}
.rp-pdet>div{display:flex;justify-content:space-between;gap:10px}
.rp-pdet>div span{color:var(--muted);font-weight:600}
.rp-pdet>div.tot{border-top:1px dashed var(--line);padding-top:6px}
.rp-pdet>div.tot b{color:var(--good);font-size:16px}
.rp-pdet .note{margin:0;font-size:12px}
.rp-iw{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.rp-iw.open{border-color:var(--ink)}
.rp-iw .rp-item{border:0;border-radius:0;width:100%;background:none;color:inherit;text-align:left;cursor:pointer;grid-template-columns:24px 1fr auto auto 16px}
.rp-item .chev{color:var(--muted);transition:transform .2s}
.rp-iw.open .rp-item .chev{transform:rotate(180deg)}
.rp-idet{display:grid;gap:8px;padding:4px 12px 12px;border-top:1px dashed var(--line);animation:rpdet .2s ease-out}
@keyframes rpdet{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.rp-ichips{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px}
.rp-ichips span{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.rp-irow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.rp-irow span{color:var(--muted);font-weight:600}
.rp-irow b{font-weight:800}
.rp-irow b small{font-size:12px;font-weight:600;color:var(--muted)}
.rp-irow.big b{font:800 20px var(--f-display)}
.rp-irow.good b{color:var(--good)}
.rp-irow.neg b{color:var(--danger)}
.rp-calc{margin:-4px 0 0;font-size:12px;color:var(--muted);text-align:right}
.rp-rates{display:grid;gap:4px}
.rp-rates div{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 10px;border-radius:10px;background:var(--surface-2)}
.rp-rates span{color:var(--muted);font-weight:600}
.rp-item{display:grid;grid-template-columns:24px 1fr auto auto;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;font-size:14px}
.rp-item .rk{width:22px;height:22px;border-radius:50%;background:var(--surface-2);font:800 11px/22px var(--f-display);text-align:center}
.rp-item .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rp-item .q{color:var(--muted);font-size:13px}
.rp-table{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px}
.rp-table table{width:100%;border-collapse:collapse;font-size:13px}
.rp-table th{background:var(--surface-2);text-align:left;padding:7px 9px;font-weight:700;white-space:nowrap}
.rp-table td{padding:7px 9px;border-top:1px solid var(--line);white-space:nowrap}
.rp-table td.num{text-align:right}
.ppl-list{display:grid;gap:8px}
.ppl-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:8px 10px}
.ppl-row.off{opacity:.55}
.ppl-row .av{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font:800 15px var(--f-display)}
.ppl-row b{display:block}
.pill.role-owner{background:var(--ink);color:var(--ink-fg)}.pill.role-manager{background:var(--accent-soft);color:var(--accent)}.pill.role-staff{background:var(--surface-2);color:var(--muted)}
.role-list{display:grid;gap:6px}
.role-list button{display:grid;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;color:var(--fg)}
.role-list button span{font-size:12.5px;color:var(--muted)}
.role-list button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.acc-code{font:800 30px var(--f-display);letter-spacing:.2em;text-align:center;background:var(--surface-2);border-radius:16px;padding:12px}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.swatches button{border:0;background:var(--surface-2);border-radius:16px;padding:10px 0 8px;display:grid;justify-items:center;gap:6px;font:600 12px var(--f-body);color:var(--fg)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink);background:var(--surface)}
.sw{width:30px;height:30px;border-radius:50%;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw::after{content:"";position:absolute;right:0;bottom:0;width:50%;height:50%;background:var(--sw2)}
.appear{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border-radius:999px;padding:4px}
.appear button{border:0;background:transparent;border-radius:999px;padding:8px 0;font:600 14px var(--f-body);color:var(--muted)}
.appear button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg)}

/* ---- tiles inside pop-up sheets: outlined so they don't melt into the white sheet ---- */
.sheet .billcard,.sheet .duecard,.sheet .bk-item,.sheet .paybox,.sheet .skel-card,.sheet .card,.sheet .mini,.sheet .menu-list button{background:var(--surface);border:1.5px solid var(--line)!important;box-shadow:none!important}
.sheet .billcard:active,.sheet .duecard:active{background:var(--surface-2)}
.sheet .bl-day{background:var(--surface-2)}
.sheet .bl-bar input[type=search],.sheet #du-q{background:var(--surface-2)!important;border:0!important;box-shadow:none!important}
.sheet .bl-chip{background:var(--surface-2);box-shadow:none}
.sheet .bl-chip.on{background:var(--ink);color:var(--ink-fg)}
.sheet .kv>div{background:var(--surface-2)}
.sheet pre.billtext{background:var(--surface-2);border:0}
.sheet .preview{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.sheet .preview:empty{display:none}
.mini{border:1.5px solid var(--line);box-shadow:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sheet{background:#141518}}
:root[data-theme="dark"] .sheet{background:#141518}
/* ---- add-to-bill: a dot flies to the Bill tab, the badge pops ---- */
.flydot{position:fixed;z-index:70;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--inbg);box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none}
@keyframes badgepop{0%{transform:scale(1)}35%{transform:scale(1.6)}70%{transform:scale(.9)}100%{transform:scale(1)}}
.badge.pop{animation:badgepop .45s ease-out}
@keyframes tabnudge{0%,100%{transform:translateY(0)}40%{transform:translateY(-3px)}}
.tabs button.nudge svg{animation:tabnudge .45s ease-out}
/* ---- messages: small pill just above the tab bar ---- */
.toast{font-size:14px;padding:10px 16px;max-width:min(360px,calc(100vw - 48px));width:max-content;left:0;right:0;margin:0 auto}
@media (max-width:1023px){

  body[data-tab="items"] .toast{bottom:calc(136px * var(--fz2,1) + env(safe-area-inset-bottom,0px))}
  body[data-tab="bill"] .toast{bottom:calc(84px * var(--fz2,1) + 84px * var(--fz,1) + env(safe-area-inset-bottom,0px))}
}

  .side-logo{background:var(--ink)!important;color:var(--ink-fg)!important;border-radius:14px!important}

  #view-bill .total{background:var(--surface)}
  #view-bill .empty{padding:28px 12px}
  #view-bill .total{position:sticky;bottom:0;margin:auto -18px 0;border-radius:0;border-width:1px 0 0;box-shadow:0 -8px 24px rgba(30,20,20,.06);padding:14px 18px 16px;z-index:2}
  .bill-line.flash{animation:flash 1.1s ease-out}

/* Notifications: top-right, slide in from the right edge, then slide back out. Taps pass straight through
   (pointer-events:none) and the keyboard never covers it. */
.toast,body[data-tab="items"] .toast,body[data-tab="bill"] .toast{top:calc(env(safe-area-inset-top,0px) + 10px);bottom:auto;right:12px;left:auto;margin:0;width:max-content;max-width:min(320px,calc(100vw - 24px));text-align:left;border-radius:14px;padding:10px 16px;line-height:1.3;
  transform:translateX(calc(100% + 24px));opacity:0;transition:transform .26s cubic-bezier(.4,0,1,1),opacity .26s}
.toast.on,body[data-tab] .toast.on{transform:none;opacity:1;transition:transform .42s cubic-bezier(.2,1.25,.4,1),opacity .2s}
@media (min-width:1024px){ .toast,body[data-tab] .toast{right:calc(var(--billw) + 16px);left:auto;max-width:420px} }
@media (prefers-reduced-motion:reduce){ .toast,.toast.on,body[data-tab] .toast,body[data-tab] .toast.on{transition:opacity .2s} }
/* ---- Printouts (#printroot is filled by prSystem; only it shows when printing) ---- */

}

/* Bill page qty and rate boxes: no default focus ring (the thin outline below replaces it). */
.bill-line .step input,.bill-line .rate input,.bill-line .step input:focus,.bill-line .rate input:focus,.bill-line .step input:focus-visible,.bill-line .rate input:focus-visible,.bill-line .step input.qp-on{outline:0!important;border:0!important;box-shadow:none!important}
.bill-line .step input:focus,.bill-line .rate input:focus,.bill-line .step input.qp-on{background:var(--surface-2)}
/* Bill page text boxes (customer name / mobile / GSTIN, received, qty, rate, cash given): a thin 1px outline so each box
   reads as a box, and a 1px ink outline while typing (or while the quick qty strip is open). No thick focus ring. */
#view-bill{--fieldline:color-mix(in srgb,var(--fg) 17%,transparent)}
#view-bill .bh-cust input,#view-bill .pay-part input,#view-bill .cash-in input,#view-bill .bill-line .step input,#view-bill .bill-line .rate input{border:1px solid var(--fieldline)!important;box-shadow:none!important;outline:0!important}
#view-bill .bh-cust input:focus,#view-bill .pay-part input:focus,#view-bill .cash-in input:focus,#view-bill .bill-line .step input:focus,#view-bill .bill-line .rate input:focus,#view-bill .bill-line .step input.qp-on{border-color:var(--ink)!important}
#view-bill .bh-cust input.need,#view-bill .pay-part input.need{border-color:var(--danger,#c0392b)!important;box-shadow:0 0 0 1px var(--danger,#c0392b)!important}   /* credit bill missing name/mobile */
/* Bill line controls stay on ONE row on small phones and at large text sizes. The pack switch ("packet ⇄") sits on the
   name's second line (next to the Hindi name), so it never pushes the rate onto a second line; the stepper and × get
   tighter when the row is narrow. */
.bill-line .bl-sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.bill-line .bl-sub .unitchip{display:inline-block;white-space:nowrap;padding:2px 9px;font-size:12.5px;line-height:1.35;margin:2px 0}
.bill-line .ctrl{container-type:inline-size}
.bill-line .ctrl .uwrap{flex-wrap:nowrap;gap:5px}
.bill-line .uwrap .note{white-space:nowrap;flex:none}
@container (max-width:290px){
  .bill-line .step button{width:30px;font-size:17px}
  .bill-line .step input{width:40px}
  .bill-line .x{width:32px;height:32px}
}
@container (max-width:250px){
  .bill-line .step button{width:27px}
  .bill-line .step input{width:34px}
  .bill-line .uwrap .note{font-size:12px}
}
/* Step-wise sheets: header ← on inner screens; the body's own "← Back" pill is kept (it does the work) but hidden. */
#sheet-back{flex:none;margin-left:-6px}
#sheet-back[hidden]{display:none}
.sheet.has-sub #sheet-body button[id$="-back"]{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;clip:rect(0 0 0 0);opacity:0;pointer-events:none}
.sheet.hero-mode #sheet-back{background:rgba(255,255,255,.92);color:#111}
/* ✕ on an inner screen closes everything: it becomes a small "✕ All" pill in the same header row (no extra row). */
.sheet.has-sub #sheet-close{width:auto;min-width:0;padding:0 12px 0 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.sheet.has-sub #sheet-close svg{width:16px;height:16px}
.sheet.has-sub #sheet-close::after{content:"All";font:700 13.5px/1 var(--f);color:var(--fg)}
:root[lang="hi"] .sheet.has-sub #sheet-close::after{content:"सब बंद";font-family:"Mukta",var(--f);font-size:14px}

.cu-info{display:grid;gap:4px;border-top:1px dashed var(--line);padding-top:8px}.cu-txt{text-align:right;max-width:65%;overflow-wrap:anywhere}
.cu-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cu-stat{background:var(--surface-2);border-radius:14px;padding:9px 8px;display:grid;gap:2px;min-width:0}.cu-stat span{font-size:11.5px;color:var(--muted);font-weight:600}.cu-stat b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cu-stat b.bad{color:var(--danger)}
@media (max-width:360px){.cu-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---- app lock / sign-in (covers everything; html.locked is set in <head> so nothing flashes before it) ---- */
html.locked body>*:not(#applock):not(#toast):not(#updpill){visibility:hidden}
html.cover body>*{visibility:hidden}
#applock{position:fixed;inset:0;z-index:100000;background:var(--bg);display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));overflow:auto}
#applock[hidden]{display:none}
.al-box{width:100%;max-width:340px;display:grid;gap:14px;text-align:center}
.al-shop{font-weight:800;font-size:20px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al-hi{font-size:15px;color:var(--muted)}
.al-av{width:64px;height:64px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:28px;font-weight:800;background:var(--ink);color:var(--ink-fg)}
.al-dots{display:flex;justify-content:center;gap:12px;min-height:18px}
.al-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.al-dots i.on{background:var(--ink);border-color:var(--ink)}
.al-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto;width:100%}
.al-pad button{height:58px;border-radius:16px;border:0;background:var(--surface);color:var(--fg);font-size:24px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;-webkit-tap-highlight-color:transparent}
.al-pad button:active{transform:scale(.96)}
.al-pad button.al-ok{background:var(--ink);color:var(--ink-fg);font-size:18px}
.al-pad button[disabled]{opacity:.45}
.al-err{min-height:20px;color:var(--danger,#c0392b);font-size:14px}
.al-link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;padding:6px;cursor:pointer}
.al-bio{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:999px;border:0;background:var(--ink);color:var(--ink-fg);font-weight:700;font-size:16px;padding:0 22px;cursor:pointer;margin:0 auto}
.al-form{display:grid;gap:10px;text-align:left}
.al-form input{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-size:18px;padding:0 14px}
.al-form .btn{height:50px;font-size:16px}
.al-shake{animation:alshake .35s}
@keyframes alshake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.sess-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sess-row:last-child{border-bottom:0}
.al-shopbox{display:grid;gap:8px;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
/* Bottom centre, above the tab bar: the top right is where notices (toast) slide in, so the two never cover each other. */
#updpill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px * var(--fz2,1) + env(safe-area-inset-bottom,0px));top:auto;z-index:9000;border:0;border-radius:999px;background:var(--ink);color:var(--ink-fg);font:700 14px var(--f-body,inherit);padding:11px 18px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;white-space:nowrap;max-width:calc(100vw - 32px)}
html.locked #updpill{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:1024px){ #updpill{bottom:24px;left:calc((100vw - var(--billw,0px)) / 2)} }
.sess-row .pill.wait{background:color-mix(in srgb,var(--gold,#b8860b) 22%,transparent);color:var(--fg)}
.speed-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.speed-row:last-child{border-bottom:0}
.sess-row small{color:var(--muted);display:block}
</style>
</head>
<body>

    <button class="iconbtn" id="mic" aria-label="Speak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  </div>
  <div class="mictip" id="mictip" hidden>

    <button id="mictip-x" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>

/* ---------------- Which shop this phone uses ----------------
 * "main" is the original shop: the fixed API_URL, storage keys and IndexedDB name exactly as before (nothing changes for its phones).
 * Other shops are reached by a code (a ?shop=CODE link, or typed on the sign-in screen); the Directory (admin/Directory.gs) turns the
 * code into that shop's backend link. Each shop's data on the phone is kept apart: localStorage keys get "<code>:" in front and the
 * IndexedDB is "ratebook_<code>". A code is only an address: each shop has its own people, PINs and sign-ins, and a phone signed in
 * to one shop ignores another shop's link or code until it signs out. Switching shops reloads the app, so nothing in memory crosses. */
const DIR_URL = "https://script.google.com/macros/s/AKfycbwFArKraCzF-asuI-8RI5NBGNUbmcmAp0lz1H1G98TqtZNWOlfp3L5hE-vY86vxC99K/exec";   // the Rate Book Directory web app link (admin/Directory.gs). Empty: only the original shop.
const SHOP = (()=>{ let x=null; try{ x=JSON.parse(localStorage.getItem("rb_shop")||"null"); }catch{} return x && x.code && x.code!=="main" && x.api ? x : {code:"main"}; })();
const SHOP_MAIN = SHOP.code==="main";
const LS_GLOBAL = new Set(["rb_shop","rb_shops","rb_dev","rb_lang","rb_fz","rb_palette","rb_appear"]);   // per phone, not per shop
const lsKey = k => SHOP_MAIN || LS_GLOBAL.has(k) ? k : SHOP.code+":"+k;
const ls = { get(k,d){try{const v=localStorage.getItem(lsKey(k));return v==null?d:JSON.parse(v)}catch{return d}}, set(k,v){try{localStorage.setItem(lsKey(k),JSON.stringify(v))}catch{}} };
const shopsKnown = ()=>{ try{ const a=JSON.parse(localStorage.getItem("rb_shops")||"[]"); return Array.isArray(a)?a:[]; }catch{ return []; } };
/** Is this phone signed in to that shop? (its own stored sign-in, read without switching) */
const shopSignedIn = code => { try{ const a=JSON.parse(localStorage.getItem(code==="main"?"rb_auth":code+":rb_auth")||"null"); return !!(a && (a.tok||a.pin)); }catch{ return false; } };
function shopRemember(sh){ try{ const a=shopsKnown().filter(x=>x.code!==sh.code); a.unshift({code:sh.code,name:sh.name||"",api:sh.api||""}); localStorage.setItem("rb_shops",JSON.stringify(a.slice(0,10))); }catch{} }
/** Open another shop: saves it as this phone's shop and reloads (a fresh start, so nothing in memory crosses over). */
function shopGo(sh){ try{ localStorage.setItem("rb_shop", JSON.stringify(sh.code==="main"?null:{code:sh.code,api:sh.api,name:sh.name||"",at:Date.now()})); }catch{} shopRemember(sh); location.replace(location.pathname); }
/** Code → that shop's backend link, from the Directory. Wrong codes are counted there (too many = this phone waits). */
async function dirLookup(code){ if(!DIR_URL) throw {code:"no_dir"};
  const r=await fetch(DIR_URL+"?"+new URLSearchParams({action:"shop",code,dev:DEV,_:String(Date.now())}),{cache:"no-store",redirect:"follow"});
  const j=await r.json(); if(!j.ok) throw {code:j.error||"bad_code"}; return {code:j.code||code, api:j.api, name:j.name||"", status:j.status||"live"}; }
/* The shop code in the link (?shop=CODE), read once at start; the address bar is cleaned so a reload doesn't repeat it. */
const SHOP_ASK = (()=>{ try{ const q=new URLSearchParams(location.search).get("shop"); if(!q) return ""; history.replaceState(null,"",location.pathname+location.hash); return q.trim().toLowerCase()==="main" ? "main" : q.trim().toUpperCase().replace(/[^A-Z0-9-]/g,"").slice(0,40); }catch{ return ""; } })();

  const mSell=s.match(new RegExp("(?:sell(?:ing)?|sale|bikri|bechne|बिक्री|बेच|mrp)[^\\d]{0,14}?"+num,"i"));
  if(mBuy) buy=+mBuy[1]; if(mSell) sell=+mSell[1];

  if(mUnit){ unit=unitFromWord(mUnit[1]); s=s.replace(mUnit[0]," "); }

  const kw=/\b(with|rates?|price|prices|rs|inr|at|for|buy(?:ing)?|purchase|cost|sell(?:ing)?|sale|mrp|kharid|khareed|bikri|bhav|daam|to|by)\b|₹|@|रेट|भाव|दाम|ख़रीद|खरीद|बिक्री|लागत|का रेट|की रेट|से/i;

  else if(sell!=null && buy==null && nums.length) buy=nums[0];

  const match=bestMatch(namePart);
  if(!op) op = match ? "update" : "add";

  if(op==="add" && sell==null) return { op, id:null, name, nameHi:"", unit:unit||S.cfg.defaultUnit, buy, sell:null };

}

/* Spoken commands arrive as one long line. Split it where one complete change ends and the next begins,
   e.g. "add 51 micron bag 1kg rates 110 and 120 चीनी 5% बढ़ा दो" → two changes. */
const SPLIT_TAIL=/^\s*(?:(?:%|percent|pratishat|प्रतिशत|rs\.?|rupees?|रुपये|रुपए|रुपया|kam|badha|badhao|ghata|ghatao|kar|karo|do|de|dena|please|कम|बढ़ा|बढ़ा|बढा|घटा|कर|करो|करें|दो|दें|दीजिए)(?=\s|$)\s*)+/i;
function completeAct(a){ return !!a && (a.op==="delete" || a.sell!=null || a.buy!=null); }
function splitCommands(line){
  const out=[]; let rest=line.trim(), guard=0;
  const okRight=b=>completeAct(b) && !(b.op==="add" && !RE_ADD.test(b._src||""));
  while(rest && guard++<25){
    const cands=[];
    // after a rate: "…120 | चीनी 5% बढ़ा दो"
    const re=/\d+(?:\.\d+)?/g; let m;
    while((m=re.exec(rest))){
      let end=m.index+m[0].length;
      if(/[a-zऀ-ॿ]/i.test(rest[end]||"")) continue;          // "1kg": part of a name
      const tail=rest.slice(end).match(SPLIT_TAIL); if(tail) end+=tail[0].length;
      const pu=rest.slice(end).match(/^\s*(?:per\s+|प्रति\s*|\/\s*)?([a-zऀ-ॿ.]+)/i); if(pu && unitFromWord(pu[1])) end+=pu[0].length;
      cands.push(end);
    }
    // before an English verb that starts a new change: "delete maida | add besan …"
    const rv=/\s(add|delete|remove|update|change|set|increase|decrease|reduce)\b/gi; let v;
    while((v=rv.exec(rest))) cands.push(v.index+1);
    cands.sort((a,b)=>a-b);
    let cut=-1;
    for(const end of cands){
      const left=rest.slice(0,end).trim(), right=rest.slice(end).trim();
      if(!left||!right) continue;
      if(/^(?:,|and|aur|और|&|\+|\/|-|to|se|से)?\s*\d/i.test(right)) continue;   // "110 and 120"
      const a=parseOne(left), b=parseOne(right); if(b) b._src=right;
      if(completeAct(a) && okRight(b)){ cut=end; break; }
    }
    if(cut<0){ out.push(rest); break; }
    out.push(rest.slice(0,cut).trim()); rest=rest.slice(cut).trim();
  }
  return out;
}
function localParse(text){ return devDigits(text).split(/\n|;|\.\s|।|\b(?:and then|phir|fir)\b|फिर/i).map(x=>x.trim()).filter(Boolean).flatMap(splitCommands).map(parseOne).filter(Boolean); }

function hiWordRules(w){

      else {
        const two=rest.slice(0,2);
        if(["aa","ee","ea","oo","ou","ow","ai","ay","au","oa","oi","oy","ie"].includes(two) && !(two==="ie" && i+2<n)){ v=two; i+=2; }

            if(i===n) v="aa";                                   // final a
            else if(nextC && nextC[0][0]==="r" && (nextC[0].length>1 || !after)) v="ar";   // car, card, star
            else if(nextC && nextC[0].length===1 && after==="e") v="e";   // tape, cake, plate
            else if(vowelCount===1) v="ae";                     // bag, max, pack

          } else if(v==="o"){

            else if(vowelCount===1 && nextC) v="au";            // box, lock, pot
          } else if(v==="u"){
            if(nextC && nextC[0].length===1 && after==="e") v="oo";   // tube, jute
          }

      const mat = v==="ae" ? "ै" : (HI_VOW_MAT[v]??"");

    }

    if(!hit){ i++; continue; }

function toHindi(name){
  const src=String(name||"").trim(); if(!src) return "";
  if(/[ऀ-ॿ]/.test(src) && !/[A-Za-z]/.test(src)) return src;      // already Hindi
  const toks=src.split(/(\s+|[,/()+&-])/);
  const words=toks.filter(x=>x && !/^\s+$/.test(x));
  return toks.map((tok,ti)=>{
    if(!tok || /^\s+$/.test(tok) || /^[,/()+&-]$/.test(tok)) return tok;
    // split leading/trailing digits from letters: "1kg" → "1" "kg", "200gsm"
    const m=tok.match(/^(\d+(?:\.\d+)?)([A-Za-z]+)\.?$/);
    if(m) return m[1]+" "+hiToken(m[2],tok);
    return hiToken(tok,tok,toks,ti);
  }).join("").replace(/\s+/g," ").trim();
}
function hiToken(tok,orig,toks,ti){
  if(/^[\d.]+$/.test(tok)) return tok;                                   // numbers stay
  if(/^\d+(\.\d+)?[x*]\d+(\.\d+)?$/i.test(tok)) return tok.replace(/\*/,"x");   // 12x18
  if(/[ऀ-ॿ]/.test(tok)) return tok;
  if(tok==="x"||tok==="X"||tok==="*") return "x";                        // 27 x 30
  const clean=tok.replace(/[^A-Za-z]/g,""); if(!clean) return tok;
  const low=clean.toLowerCase();
  if(low==="no" && /\.$/.test(tok)) return "नंबर";
  if(HI_WORDS[low]) return HI_WORDS[low];
  const isCaps = clean===clean.toUpperCase() && clean.length>1;
  if(HI_ACRONYMS.has(low) || (isCaps && clean.length<=4 && !/[aeiou]/i.test(clean.slice(1))) || !/[aeiouy]/.test(low))
    return [...low].map(c=>HI_LETTERS[c]||"").join("");
  // plural s on a known word: "drones" → ड्रोन्स
  if(low.endsWith("s") && HI_WORDS[low.slice(0,-1)]) return HI_WORDS[low.slice(0,-1)]+"्स";
  return hiWordRules(low);
}

/* ---------------- Printing (normal and GST bills) ----------------
 * Per phone / laptop (rb_print): paper a4 | a5 | 80 | 58 (mm roll), how a roll printer is reached (via):
 *   system — the phone/laptop print screen (office printers, USB/Wi-Fi receipt printers with a driver)
 *   rawbt  — Android + Bluetooth receipt printer through the free RawBT app (ESC/POS sent straight to it)
 *   image  — share a receipt picture to the printer maker's app (iPhone Bluetooth printers)
 * and auto (print after Done). A4/A5 print a full invoice; 58/80 mm print a narrow receipt. All from one model (inv). */
const PR_PAPERS=["a4","a5","80","58"];
function prGet(){ const d={paper:"a4",via:"system",auto:false}; const v=ls.get("rb_print",null); return v&&typeof v==="object"?{...d,...v}:d; }
function prSet(v){ ls.set("rb_print",v); }
const prRoll=p=>p==="80"||p==="58";
const prCols=p=>p==="58"?32:48;
const prMoney=n=>Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
/** Every number a printout needs, worked out once (same sums as the bill screen and the PDF). */
function prCalc(inv){
  const g=inv.gst ? gstCalcFor(inv.lines, inv.igst) : null;
  const total=g ? g.total : r2(inv.lines.reduce((a,l)=>a+l.qty*l.rate,0));
  const taxes=g ? g.rows.map(r=>({label:r.kind==="I"?`IGST ${fmtN(r.rate)}%`:`${r.kind==="C"?"CGST":"SGST"} ${fmtN(r.rate/2)}%`, v:r.v})) : [];
  return {g,total,taxes,due:inv.pay&&inv.pay.mode!=="paid"};
}
const prDate=d=>{ const x=d?new Date(d):new Date(); return x.toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+x.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}); };
const prAsc=v=>String(v||"").replace(/₹/g,"Rs.").replace(/[–—]/g,"-").replace(/×/g,"x").replace(/[^\x20-\x7E]/g,"");

/* ---- text receipt (RawBT and the shared picture): fixed columns ---- */
function prWrap(s,w){ const out=[]; let line=""; String(s||"").split(/\s+/).forEach(word=>{ while(word.length>w){ if(line){ out.push(line); line=""; } out.push(word.slice(0,w)); word=word.slice(w); } if(!word) return; if(!line) line=word; else if(line.length+1+word.length<=w) line+=" "+word; else { out.push(line); line=word; } }); if(line) out.push(line); return out.length?out:[""]; }
const prLR=(l,r,w)=>{ l=String(l); r=String(r); if(l.length+r.length+1>w) l=l.slice(0,Math.max(0,w-r.length-1)); return l+" ".repeat(Math.max(1,w-l.length-r.length))+r; };
const prC=(s,w)=>{ s=String(s).slice(0,w); const p=Math.floor((w-s.length)/2); return " ".repeat(p)+s; };
/** Lines of {t, b (bold), c (centre), big} for a w-character roll. */
function receiptLines(inv,w){
  const c=prCalc(inv), L=[], hr={t:"-".repeat(w)}, push=(t,o)=>L.push({t,...(o||{})});
  prWrap(prAsc(S.cfg.shopName)||"Rate Book",Math.floor(w/2)).forEach(x=>push(x,{c:1,b:1,big:1}));   // double size: half as many characters fit
  if(S.cfg.shopAddress) prWrap(prAsc(S.cfg.shopAddress),w).forEach(x=>push(x,{c:1}));
  if(inv.gst && S.cfg.shopGstin) push("GSTIN: "+S.cfg.shopGstin,{c:1});
  L.push(hr);
  push(inv.gst?"TAX INVOICE":"BILL",{c:1,b:1});
  if(S.cfg.mode==="test") push("TEST BILL - not a real invoice",{c:1});
  if(inv.cancelled) push("*** CANCELLED ***",{c:1,b:1});
  push((inv.gst?"Invoice":"Bill")+" No: "+inv.no,{b:1}); push("Date: "+prDate(inv.date));
  if(inv.cust.name) push("To: "+prAsc(inv.cust.name)); if(inv.cust.mobile) push("Mobile: "+inv.cust.mobile);
  if(inv.gst && inv.cust.gstin) push("GSTIN: "+inv.cust.gstin); if(inv.gst && inv.pos) push("Place of supply: "+prAsc(inv.pos));
  L.push(hr); push(prLR("Item","Amount",w),{b:1}); L.push(hr);
  inv.lines.forEach((l,i)=>{ prWrap(`${i+1}. ${prAsc(l.name)}`,w).forEach(x=>push(x));
    const q=prAsc(`${qtyText(l.qty,l.unit,true)} x ${prMoney(l.rate).replace(/\.00$/,"")}${isPart(l.qty,l.unit)?"/"+l.unit:""}`);
    push(prLR("   "+q, prMoney(r2(l.qty*l.rate)), w));
    if(inv.gst) push(`   HSN ${l.hsn||"-"}  GST ${fmtN(l.gst)}%`); });
  L.push(hr);
  if(c.g){ push(prLR("Taxable value",prMoney(c.g.taxable),w)); c.taxes.forEach(x=>push(prLR(x.label,prMoney(x.v),w))); if(c.g.roundOff) push(prLR("Round off",(c.g.roundOff>0?"+":"-")+prMoney(Math.abs(c.g.roundOff)),w)); }
  if(w>=40) push(prLR("TOTAL","Rs."+prMoney(c.total),Math.floor(w/2)),{b:1,big:1}); else push(prLR("TOTAL","Rs. "+prMoney(c.total),w),{b:1});
  if(c.due){ push(prLR("Paid",prMoney(inv.pay.recv),w)); push(prLR("Balance due",prMoney(inv.pay.due),w),{b:1}); }
  if(inv.pay && PM_EN[inv.pay.pm]) push(prLR("Paid by",PM_EN[inv.pay.pm],w));
  if(inv.gst) prWrap(prAsc(inWords(c.total)),w).forEach(x=>push(x));
  L.push(hr);
  if(S.cfg.billFooter) prWrap(prAsc(S.cfg.billFooter),w).forEach(x=>push(x,{c:1}));
  push("Thank you!",{c:1});
  return L.map(x=>({...x, t: x.c ? prC(x.t, x.big?Math.floor(w/2):w) : x.t}));
}
/** ESC/POS bytes for RawBT: init, centre/bold/double size where marked, feed and cut. */
function escpos(lines){
  const b=[0x1B,0x40]; const txt=s=>{ for(const ch of s) b.push(ch.charCodeAt(0)&0x7F); b.push(0x0A); };
  lines.forEach(x=>{ b.push(0x1B,0x61,x.c?1:0); b.push(0x1B,0x45,x.b?1:0); b.push(0x1D,0x21,x.big?0x11:0x00); txt(x.c?x.t.trim():x.t); });
  b.push(0x1B,0x61,0,0x1B,0x45,0,0x1D,0x21,0); b.push(0x1B,0x64,4); b.push(0x1D,0x56,0x41,0x03);
  return new Uint8Array(b);
}
function prRawbt(inv,paper){
  const bytes=escpos(receiptLines(inv,prCols(paper))); let s=""; bytes.forEach(x=>s+=String.fromCharCode(x));
  const b64=btoa(s);

}
/** Receipt as a picture (384 px wide for 58 mm, 576 px for 80 mm — the printers' dot widths), for printer apps. */
function receiptPng(inv,paper){
  const w=prCols(paper), W=paper==="58"?384:576, cw=W/w, fs=Math.floor(cw/0.6), lh=Math.round(fs*1.35), lines=receiptLines(inv,w);
  const cv=document.createElement("canvas"); cv.width=W; cv.height=lines.reduce((a,x)=>a+lh*(x.big?2:1),0)+lh*3;
  const g=cv.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,cv.width,cv.height); g.fillStyle="#000"; g.textBaseline="top";
  let y=lh;
  lines.forEach(x=>{ const sz=x.big?fs*2:fs; g.font=`${x.b?"bold ":""}${sz}px "Courier New",Courier,monospace`;
    g.fillText(x.t, 0, y); y+=lh*(x.big?2:1); });
  return new Promise(res=>cv.toBlob(res,"image/png"));
}

}

const isoDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function rpRange(k){
  const now=new Date(), d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const fyStart=y=>new Date(y,3,1), fyy=now.getMonth()>=3?now.getFullYear():now.getFullYear()-1;
  if(k==="today") return [isoDay(d),isoDay(d)];
  if(k==="yest"){ const y=new Date(d); y.setDate(d.getDate()-1); return [isoDay(y),isoDay(y)]; }
  if(k==="week"){ const s=new Date(d); s.setDate(d.getDate()-((d.getDay()+6)%7)); return [isoDay(s),isoDay(d)]; }
  if(k==="month") return [isoDay(new Date(d.getFullYear(),d.getMonth(),1)),isoDay(d)];
  if(k==="lastMonth") return [isoDay(new Date(d.getFullYear(),d.getMonth()-1,1)),isoDay(new Date(d.getFullYear(),d.getMonth(),0))];
  if(k==="fy") return [isoDay(fyStart(fyy)),isoDay(d)];

function rpSplit(R){

  S.items.forEach(it=>{ if(it.cat) anyCat=true; grp.set(String(it.name||"").trim().toLowerCase(), it.cat||""); });

/* One item's detail in the report: how many bills, average price, the prices charged, buy cost and profit. */
const rsx=n=>{ const v=Math.round((+n||0)*100)/100; return Number.isInteger(v)?rs(v):rs2(v); };
function rpItemDetail(it){
  const u=unitL(it.unit)||"", per=t("riPer",u||"unit");
  if(it.bills===undefined) return `<div class="rp-idet"><div class="rp-irow"><span>${esc(t("riAvgSell"))}</span><b class="num">${rsx(it.qty?it.amount/it.qty:0)} <small>${esc(per)}</small></b></div><p class="note" style="margin:0">${esc(t("riOld"))}</p></div>`;
  const avg=it.qty?it.amount/it.qty:0;
  const showPf=!!S.cfg.showProfit && !hideBuy();
  const row=(l,v,cls)=>`<div class="rp-irow${cls?" "+cls:""}"><span>${esc(l)}</span><b class="num">${v}</b></div>`;
  let h=`<div class="rp-idet">
    <div class="rp-ichips"><span>${esc(t("riBills",it.bills))}</span><span>${esc(t("riSold"))} ${esc(fmtN(it.qty))} ${esc(u)}</span><span>${esc(t("riSales"))} ${esc(rs(it.amount))}</span></div>
    ${row(t("riAvgSell"),`${rsx(avg)} <small>${esc(per)}</small>`,"big")}
    <p class="rp-calc num">${esc(rs(it.amount))} ÷ ${esc(fmtN(it.qty))} ${esc(u)} = ${esc(rsx(avg))}</p>`;
  if(it.rates && it.rates.length>1){
    h+=`<p class="rp-sub" style="margin:2px 0 0">${esc(t("riRange",rsx(it.min),rsx(it.max)))}</p><div class="rp-rates">${it.rates.map(r=>`<div><b class="num">${rsx(r.rate)}</b><span>${esc(t("riRateRow",fmtN(r.qty),u,r.bills))}</span></div>`).join("")}</div>`;
  }
  if(showPf){
    if(it.costQty>0){
      const avgBuy=it.cost/it.costQty, pf=it.profit, mg=it.cost>0?Math.round(pf/it.cost*1000)/10:null;
      h+=row(t("riAvgBuy"),`${rsx(avgBuy)} <small>${esc(per)}</small>`);
      h+=row(t("riProfit"),`${pf<0?"−":""}${rsx(Math.abs(pf))}${mg!=null?` <small>· ${mg}%</small>`:""}`,pf<0?"neg":"good");
      h+=`<p class="rp-calc num">${esc(fmtN(it.costQty))} ${esc(u)} × (${esc(rsx(it.costAmt/it.costQty))} − ${esc(rsx(avgBuy))}) = ${esc((pf<0?"−":"")+rsx(Math.abs(pf)))}</p>`;
      if(it.costQty < it.qty-1e-9) h+=`<p class="note" style="margin:0">${esc(t("riPartial",fmtN(it.costQty),fmtN(it.qty),u))}</p>`;
    } else h+=`<p class="note" style="margin:0">${esc(t("riNoBuy"))}</p>`;
  }
  if(showPf && it.estQty>0) h+=`<p class="note" style="margin:0">${esc(t("riEst",fmtN(it.estQty),u))}</p>`;
  if(it.gstQty>0) h+=`<p class="note" style="margin:0">${esc(t("riGstNote"))}</p>`;
  return h+`</div>`;
}
function exportCsv(kind){
  const R=RP.data; if(!R) return;
  const q=v=>{ const x=String(v==null?"":v); return /[",\n]/.test(x)?`"${x.replace(/"/g,'""')}"`:x; };
  let rows, name;
  if(kind==="reg"){ name="invoice-register"; rows=[["Date","Invoice No","Customer","GSTIN","Place of supply","Taxable value","CGST","SGST","IGST","Invoice total","Status"]].concat(R.register.map(r=>[r.date,r.no,r.customer,r.gstin,r.pos,r.taxable,r.cgst,r.sgst,r.igst,r.total,r.status])); }
  else if(kind==="hsn"){ name="hsn-summary"; rows=[["HSN","GST rate %","Quantity","Taxable value","Total tax"]].concat(R.gst.hsn.map(h=>[h.hsn,h.rate,h.qty,h.taxable,h.tax])); }
  else { name="item-sales"; const pf=!!S.cfg.showProfit && !hideBuy(); const r2=v=>Math.round(v*100)/100;
    rows=[["Item","Unit","Quantity","Amount","Bills","Avg selling price"].concat(pf?["Avg buy price","Profit"]:[])].concat(R.items.map(i=>[i.name,i.unit,i.qty,i.amount,i.bills==null?"":i.bills,i.qty?r2(i.amount/i.qty):""].concat(pf?[i.costQty?r2(i.cost/i.costQty):"",i.profit==null?"":i.profit]:[]))); }
  const csv="﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n");
  shareFile(new Blob([csv],{type:"text/csv"}), `${name}_${R.from||"all"}_to_${R.to||"all"}.csv`, `${S.cfg.shopName||"Rate Book"} · ${name}`);
}

function speedHTML(){ const a=ls.get("rb_perf",[]); if(!a.length) return `<p class="note" style="margin:0">${esc(t("speedNone"))}</p>`;
  const by={}; a.forEach(x=>{ (by[x[0]]=by[x[0]]||[]).push(x); });
  const q=(v,f)=>{ const y=v.slice().sort((m,n)=>m-n); return y[Math.min(y.length-1,Math.floor(f*y.length))]; }, sec=ms=>ms==null?"—":(ms/1000).toFixed(ms<10000?1:0)+" s";
  return Object.keys(by).sort((m,n)=>by[n].length-by[m].length).slice(0,8).map(k=>{ const tot=by[k].map(x=>x[1]), srv=by[k].map(x=>x[2]).filter(x=>x!=null);

/* Mic: real speech recognition where the browser has it (Chrome on Android, Safari on iPhone); keyboard mic otherwise. */
/* Long dictation for the wand. Phone browsers end a listening session after a short pause,
   so we quietly start a new one and keep everything already said, until the person taps Stop
   (or stays silent for 15 seconds). */
const isAndroid=/android/i.test(navigator.userAgent);
const dict={on:false,rec:null,base:"",said:"",btn:null,onText:null,onFail:null,idle:null,starts:0};
function dictShow(extra){ const body=(dict.said+(extra||"")).replace(/\s+/g," ").trim(); dict.onText&&dict.onText((dict.base?dict.base+"\n":"")+body); }
function dictIdle(){ clearTimeout(dict.idle); dict.idle=setTimeout(()=>{ if(dict.on){ dictStop(); toast(t("micStopped")); } },15000); }
function dictStart(btn,base,onText,onFail){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR||ls.get("rb_sr_bad",false)){ onFail(); return; }
  if(rec){ try{ rec.abort(); }catch{} rec=null; }
  Object.assign(dict,{on:true,base,said:"",btn,onText,onFail,starts:0});
  btn.classList.add("listening"); const l=btn.querySelector("span"); if(l) l.textContent=t("stopListening");
  toast(t("listeningLong")); dictIdle(); dictSession(SR);
}
function dictSession(SR){
  if(!dict.on) return;
  if(++dict.starts>80){ dictStop(); return; }
  let r; try{ r=new SR(); }catch{ dictStop(); dict.onFail&&dict.onFail(); return; }
  dict.rec=r; r.lang=S.lang==="hi"?"hi-IN":"en-IN"; r.interimResults=true; r.maxAlternatives=1;
  r.continuous=!isAndroid;   // Android repeats words in continuous mode; short sessions + restart are cleaner there
  let fin="", mid="", fatal=false;
  r.onresult=e=>{ fin=""; mid=""; for(let i=0;i<e.results.length;i++){ const x=e.results[i]; if(x.isFinal) fin+=x[0].transcript+" "; else mid+=x[0].transcript+" "; } dictShow(fin+mid); dictIdle(); };
  r.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"){ ls.set("rb_sr_bad",true); fatal=true; } else if(e.error==="audio-capture"||e.error==="network"||e.error==="language-not-supported"){ fatal=true; } };
  r.onend=()=>{ const got=(fin||mid).trim(); if(got) dict.said+=got+" "; dictShow(""); if(dict.rec===r) dict.rec=null;
    if(fatal){ const f=dict.onFail; dictStop(); f&&f(); return; }
    if(dict.on) setTimeout(()=>dictSession(SR), isAndroid?80:150); };
  try{ r.start(); }catch{ setTimeout(()=>dictSession(SR),300); }
}
function dictStop(){
  if(!dict.on && !dict.rec) return;
  dict.on=false; clearTimeout(dict.idle);
  const r=dict.rec; if(r){ try{ r.stop(); }catch{} }
  const b=dict.btn; if(b){ b.classList.remove("listening"); const l=b.querySelector("span"); if(l) l.textContent=t("speak"); }
}

let rec=null;
function listen(btn,onText,onFail){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(rec){ try{ rec.stop(); }catch{} return; }
  if(!SR || ls.get("rb_sr_bad",false)){ onFail(); return; }
  let got=false;
  try{
    rec=new SR(); rec.lang=S.lang==="hi"?"hi-IN":"en-IN"; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
    btn.classList.add("listening"); toast(t("listening"));
    rec.onresult=e=>{ got=true; let s=""; for(const r of e.results) s+=r[0].transcript; onText(s); };
    rec.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"){ ls.set("rb_sr_bad",true); } if(e.error!=="no-speech"&&e.error!=="aborted") onFail(); };
    rec.onend=()=>{ btn.classList.remove("listening"); rec=null; };
    rec.start();
  }catch{ btn.classList.remove("listening"); rec=null; onFail(); }
}
$("#mic").onclick=e=>{ if(dict.on) dictStop(); listen(e.currentTarget, s=>{ $("#q").value=s; onQuery(s); $("#mictip").hidden=true; }, ()=>{ $("#mictip").hidden=false; $("#q").focus(); }); };

let sheetOnClose=null;
/* ---- Sheet back-stack ----
 * Opening a screen while another is showing puts the current one on SHEET_STK: its live DOM (so its buttons keep working),
 * footer, title, classes, scroll position and onClose. ← / Back / Cancel (sheetBack) put it back exactly as it was.
 * A parent screen opens with a key (sheetKey("settings") just before openSheet): opening a key that's already on the stack
 * (e.g. openSettings() after saving a person) goes back to that level with fresh content and the same scroll position, and
 * a key that's already showing just redraws in place. A legacy "*-back" button click counts as going back, so the parent it
 * re-opens replaces the current level instead of stacking. ✕ (closeSheet) clears everything. */
let SHEET_STK=[], sheetCurKey="", sheetKeyNext="", sheetGoingBack=0, sheetNo=0;
const sheetKey=k=>{ sheetKeyNext=String(k); };

  while(b.firstChild) x.body.appendChild(b.firstChild); while(f.firstChild) x.foot.appendChild(f.firstChild); return x; }
/** Hold a scroll position while the screen's content finishes loading (cards that fill in a moment later). Stops on a touch. */
function sheetKeepScroll(y){ const b=$("#sheet-body"), t0=Date.now(); let stop=false; const halt=()=>{ stop=true; };
  b.addEventListener("touchstart",halt,{once:true,passive:true}); b.addEventListener("wheel",halt,{once:true,passive:true});
  const step=()=>{ if(stop || Date.now()-t0>1500) return; if(Math.abs(b.scrollTop-y)>2 && b.scrollHeight-b.clientHeight>0) b.scrollTop=y; requestAnimationFrame(step); }; step(); }
/** One level back (exactly as it was), or close when nothing is under this screen. */
function sheetBack(){ const prev=SHEET_STK.pop(); if(!prev){ closeSheet(); return; }
  const b=$("#sheet-body"), f=$("#sheet-foot"), sh=$("#sheet");
  b.replaceChildren(prev.body); f.replaceChildren(prev.foot); f.hidden=prev.footHidden; $("#sheet-title").textContent=prev.title;
  sh.className=prev.cls; sheetCurKey=prev.key; sheetOnClose=prev.onClose; b.scrollTop=prev.scroll; sheetKeepScroll(prev.scroll); sheetNavSync(); }
/** Cancel on a screen: back one level if there is one, else close. */
const sheetCancel=()=>sheetBack();
function openSheet(title,body,foot,{full=false,onClose=null,key=""}={}){
  const sh0=$("#sheet"), open=!sh0.hidden && sh0.classList.contains("on"); key=key||sheetKeyNext||("s"+(++sheetNo)); sheetKeyNext=""; let keep=0;
  if(!open) SHEET_STK=[];
  else if(key===sheetCurKey) keep=$("#sheet-body").scrollTop;                       // the same screen redrawn: stay where you were
  else { const i=SHEET_STK.findIndex(x=>x.key===key);
    if(i>=0){ keep=SHEET_STK[i].scroll; SHEET_STK=SHEET_STK.slice(0,i); }           // back to a screen further down, fresh
    else if(!(sheetGoingBack && Date.now()-sheetGoingBack<2000)) SHEET_STK.push(sheetSnap()); }   // a new screen on top
  sheetGoingBack=0; sheetCurKey=key;

  const f=$("#sheet-foot"); f.innerHTML=foot||""; f.hidden=!foot;

  requestAnimationFrame(()=>{ sh.classList.add("on"); sc.classList.add("on"); });

/* Sheet navigation. A sheet showing an inner screen (a bill opened from All bills, a customer from Credit, a vendor's bill …)
   has a "*-back" button in its body. The header ← (left, next to the title), a tap outside and the phone's Back go up ONE
   level through it. ✕ (right) always closes the whole sheet in one tap, from any depth. On inner screens ✕ shows a small
   "all" tag so it reads as "close all". The body's own "← Back" pill is hidden; the header ← replaces it. */
function sheetSubBack(){ return [...document.querySelectorAll('#sheet-body button[id$="-back"]')].find(b=>b.offsetParent!==null && !b.disabled); }
function sheetStep(){ const b=sheetSubBack(); if(b) b.click(); else sheetBack(); }
/* a screen's own "← …" back button (clicked by the user, the header ← or the phone's Back) means "going back" */
$("#sheet-body").addEventListener("click",e=>{ if(e.target.closest('button[id$="-back"]')) sheetGoingBack=Date.now(); },true);
function sheetNavSync(){ const sub=!!sheetSubBack() || SHEET_STK.length>0, sh=$("#sheet"); sh.classList.toggle("has-sub",sub); $("#sheet-back").hidden=!sub;
  $("#sheet-close").setAttribute("aria-label", sub?t("closeAll"):t("close")); }
$("#sheet-close").onclick=closeSheet; $("#sheet-back").onclick=sheetStep; $("#scrim").onclick=sheetStep;
{ let q=0; new MutationObserver(()=>{ if(q) return; q=requestAnimationFrame(()=>{ q=0; sheetNavSync(); }); }).observe($("#sheet-body"),{childList:true,subtree:true,attributes:true,attributeFilter:["hidden","style","class"]}); }

function loadImg(file){
  const viaImg=()=>new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const im=new Image(); im.onload=()=>{ res(im); setTimeout(()=>URL.revokeObjectURL(url),1000); }; im.onerror=()=>{ URL.revokeObjectURL(url); rej(); }; im.src=url; });
  if(window.createImageBitmap){
    return createImageBitmap(file,{imageOrientation:"from-image"}).then(bm=>({naturalWidth:bm.width,naturalHeight:bm.height,_src:bm})).catch(viaImg);
  }
  return viaImg();
}
function drawImg(im,max,square){
  const c=document.createElement("canvas"); let w=im.naturalWidth, h=im.naturalHeight, sx=0, sy=0, sw=w, sh=h;
  if(square){ const m=Math.min(w,h); sx=(w-m)/2; sy=(h-m)/2; sw=sh=m; w=h=Math.min(max,m); }
  else { const r=Math.min(1,max/Math.max(w,h)); w=Math.round(w*r); h=Math.round(h*r); }
  c.width=w; c.height=h; const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.drawImage(im._src||im,sx,sy,sw,sh,0,0,w,h); return c;
}
function toJpeg(c,maxBytes){ let q=0.8, d=c.toDataURL("image/jpeg",q); while(d.length>maxBytes && q>0.35){ q-=0.1; d=c.toDataURL("image/jpeg",q); } return d; }
async function processImage(file){ const im=await loadImg(file); return { thumb: toJpeg(drawImg(im,112,true),9000), full: toJpeg(drawImg(im,640,false),45000) }; }

/** This phone's own script errors go to the shop's script (memory only there), so they show on the admin dashboard → Errors.
    Up to 10 different errors per app start; the app's expected failures (offline, wrong PIN…) aren't errors and aren't sent. */
const ERR_SENT=new Set(); let errN=0;
function errReport(m,w,st){ try{ m=String(m||"").slice(0,300); w=String(w||""); st=String(st||"");
  if(!m || /ResizeObserver loop|^Script error\.?$/i.test(m) || /-extension:\/\//.test(w+st)) return;
  const k=m+"|"+w; if(ERR_SENT.has(k) || ++errN>10) return; ERR_SENT.add(k);
  if(navigator.onLine===false || !apiUrl() || !(S.sv>=36)) return;   // older scripts would check a PIN first and count it as wrong
  fetch(apiUrl(),{method:"POST",keepalive:true,redirect:"follow",body:JSON.stringify({action:"clientErr",shop:SHOP.code,dev:DEV,by:(S.auth&&S.auth.by)||"",
    e:{m,w:w.slice(0,160),st:st.slice(0,500),ua:navigator.userAgent.slice(0,90),tab:S.tab||""}})}).catch(()=>{}); }catch{} }
window.addEventListener("error",e=>{ if(e && e.message) errReport(e.message,(e.filename||"").split("/").pop().split("?")[0]+":"+e.lineno+":"+e.colno,e.error&&e.error.stack); });
window.addEventListener("unhandledrejection",e=>{ const r=e&&e.reason; if(!r || (r.code && !r.stack)) return; errReport(r.message||String(r),"promise",r.stack); });
function perfAdd(action,t0,j){ if(!action || action==="rev" || action==="thumbs") return;
  try{ const a=ls.get("rb_perf",[]); a.push([action,Math.round(performance.now()-t0),j&&typeof j.ms==="number"?j.ms:null,Date.now()]); ls.set("rb_perf",a.slice(-100)); }catch{} }

async function apiGet0(params){

async function apiPost0(body){
  if(navigator.onLine===false) throw {code:"offline"};
  const a=S.auth||{};
  const t0=performance.now();
  const r=await fetch(apiUrl(),{method:"POST",redirect:"follow",body:JSON.stringify({...(a.tok?{tok:a.tok}:{pin:a.pin}),by:a.by||"",env:S.cfg.mode,dev:DEV,k:ls.get("rb_view",""),shop:SHOP.code,...body})});
  if(!r.ok) throw {code:"http"};
  const j=await r.json(); perfAdd(body&&body.action,t0,j);
  if(j.shop && j.shop!==SHOP.code){ shopMismatch(); throw {code:"wrong_shop"}; }
  if(!j.ok){ const c=j.error;
    if(c==="no_test") setTimeout(noTestNow,0);
    if(c==="bad_session" && a.tok && S.auth && S.auth.tok===a.tok) setTimeout(()=>signedOut("siGone"),0);

    if(c==="need_signin" && a.pin && !a.tok) setTimeout(()=>signedOut("siNeed"),0);
    if(c==="paused") shopPausedNote();
    throw {code:c||"server"}; }
  return j;
}

/* Local thumbnail store (IndexedDB) so pictures don't download every time. */
const idb=(()=>{ let dbp=null;
  function open(){ if(dbp) return dbp; dbp=new Promise((res,rej)=>{ try{ const r=indexedDB.open(SHOP_MAIN?"ratebook":"ratebook_"+SHOP.code,1); r.onupgradeneeded=()=>{ r.result.createObjectStore("thumbs"); r.result.createObjectStore("images"); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); return dbp; }
  function run(store,mode,fn){ return open().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(store,mode); const req=fn(tx.objectStore(store)); tx.oncomplete=()=>res(req&&("result" in req)?req.result:undefined); tx.onerror=()=>rej(tx.error); })); }
  return { get:(s,k)=>run(s,"readonly",st=>st.get(k)).catch(()=>undefined), set:(s,k,v)=>run(s,"readwrite",st=>st.put(v,k)).catch(()=>{}), del:(s,k)=>run(s,"readwrite",st=>st.delete(k)).catch(()=>{}),
    all:s=>open().then(db=>new Promise((res)=>{ const out={}; const tx=db.transaction(s,"readonly"); const c=tx.objectStore(s).openCursor(); c.onsuccess=()=>{ const cur=c.result; if(cur){ out[cur.key]=cur.value; cur.continue(); } }; tx.oncomplete=()=>res(out); tx.onerror=()=>res(out); })).catch(()=>({})) };
})();
async function loadFull(it){

  try{ const j=await apiGet({action:"image",id:it.id}); if(j.data){ idb.set("images",it.id,{v:it.imgV,d:j.data}); return j.data; } }catch{}
  return c?c.d:null;
}
const MAX_PHOTOS=5;
const photoKey=(id,j)=> j?`${id}#${j+1}`:id;
/** All photos of an item, in order: [{k, data}]. Cached on the phone per photo, keyed by the item's photo version. */
async function loadAllPhotos(it){
  const n=it.imgV?(it.imgs||1):0; if(!n) return [];
  if(n===1){ const d=await loadFull(it); return d?[{k:it.id,data:d}]:[]; }
  const keys=Array.from({length:n},(_,j)=>photoKey(it.id,j));
  const cached=await Promise.all(keys.map(k=>idb.get("images",k)));
  if(cached.every(c=>c&&c.v===it.imgV)) return keys.map((k,j)=>({k,data:cached[j].d}));
  const j=await apiGet({action:"images",id:it.id});
  const list=(j.images||[]).filter(x=>x.data);
  list.forEach(x=>idb.set("images",x.k,{v:it.imgV,d:x.data}));
  return list;
}

  /* Group: chips for every group + "New group". A new item (or one without a group) gets the guess automatically until a chip is tapped. */

    $("#ef-cauto").hidden=!(catAuto && cur); };
  const autoCat=()=>{ if(catTouched) return; const g=guessCat($("#ef-name").value); $("#ef-cat").value=g; catAuto=!!g; drawCats(); };
  $("#ef-catpick").onclick=e=>{ const n=e.target.closest("[data-cnew]"); if(n){ $("#ef-catnew").hidden=false; $("#ef-catnew-in").focus(); return; }
    const b=e.target.closest("[data-cpick]"); if(!b) return; catTouched=true; catAuto=false; $("#ef-cat").value = $("#ef-cat").value===b.dataset.cpick ? "" : b.dataset.cpick; drawCats(); };
  const addNew=()=>{ const v=normCat($("#ef-catnew-in").value); if(!v) return; catTouched=true; catAuto=false; $("#ef-cat").value=v; $("#ef-catnew-in").value=""; $("#ef-catnew").hidden=true; addGroup(v); drawCats(); };
  $("#ef-catnew-ok").onclick=addNew; $("#ef-catnew-in").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); addNew(); } });
  $("#ef-name").addEventListener("input",autoCat);
  if(!catTouched) autoCat(); else drawCats();
  $("#ef-cancel").onclick=sheetCancel;
  $("#ef").onsubmit=e=>{ e.preventDefault(); $("#ef-save").click(); };
  ["ef-name","ef-buy"].forEach((k,i)=>$("#"+k).addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); $(i?"#ef-sell":"#ef-buy").focus(); } }));
  if(it){
    $("#ef-del").onclick=()=>{ $("#ef-del").hidden=true; const c=$("#ef-delc"); c.hidden=false; setTimeout(()=>c.scrollIntoView({block:"center",behavior:"smooth"}),30); };
    $("#ef-deln").onclick=()=>{ $("#ef-delc").hidden=true; $("#ef-del").hidden=false; };
    $("#ef-dely").onclick=()=>{ closeSheet(); toast(t("saving")); const snapshot=S.items.slice();
      write({action:"delete",ids:[id]},()=>{ S.items=S.items.filter(x=>x.id!==id); S.bill=S.bill.filter(l=>l.id!==id); saveBill(); }).then(()=>toast(t("deleted"))).catch(()=>{ S.items=snapshot; afterLocal(); }); };
  }
  $("#ef-save").onclick=()=>{
    const name=$("#ef-name").value.trim(), nameHi=$("#ef-hi").value.trim(), unit=$("#ef-unit").dataset.unit, buyS=$("#ef-buy").value.trim(), buy=toNum(buyS), sell=toNum($("#ef-sell").value);

    if(!name){ err.textContent=t("needName"); return; }
    if(isNaN(sell)||sell<0 || (buyS!=="" && (isNaN(buy)||buy<0))){ err.textContent=t("needRate"); return; }
    if(findDup(name,id)){ err.textContent=t("dup"); return; }
    if(navigator.onLine===false){ err.textContent=t("offlineWrite"); return; }
    const key=id||tmpId();
    const hsn=$("#ef-hsn").value.replace(/\s/g,""), gstV=toNum($("#ef-gst").value);
    if(isNaN(gstV)||gstV<0||gstV>100){ err.textContent=t("gstPctL")+": 0–100"; return; }
    const aqS=$("#ef-aqty").value.trim(), aq=toNum(aqS), asS=$("#ef-asell").value.trim(), aSell=toNum(asS);
    if(aqS!=="" && !(aq>0)){ err.textContent=t("packBad"); $("#ef-alt").open=true; return; }
    if(asS!=="" && (isNaN(aSell)||aSell<0)){ err.textContent=t("needRate"); $("#ef-alt").open=true; return; }
    const altUnit = aq>0 ? $("#ef-aunit").dataset.unit : "", altQty = aq>0 ? aq : 0, altSell = (aq>0 && asS!=="") ? aSell : null;
    const hiFinal = nameHi || toHindi(name);
    const aliases=aliasList($("#ef-aka").value).join(", "), cat=normCat($("#ef-cat").value);
    const rec={ base: it?it.updatedAt:undefined, id: id||undefined, tmp: id?undefined:key, name, nameHi:hiFinal, unit, buy:isNaN(buy)?0:buy, sell, hsn, gst:gstV, altUnit, altQty, altSell, aliases, cat };
    const imgChange=photosChanged ? photos.slice() : null;
    closeSheet(); toast(t("saving"));
    write({action:"upsert",items:[rec]},()=>{
      upsertLocal({ id:key, name, nameHi:hiFinal, unit, buy:rec.buy, sell, hsn, gst:gstV, altUnit, altQty, altSell, aliases, cat, imgV: imgChange ? (imgChange.length?Date.now():0) : (it?it.imgV:0), imgs: imgChange ? imgChange.length : (it?it.imgs||0:0), updatedAt:Date.now(), updatedBy:byName(), pending:true });
      if(imgChange && imgChange.length) S.thumbs[key]={v:S.items.find(x=>x.id===key).imgV,d:imgChange[0].thumb||imgChange[0].src||""};
      const bl=S.bill.find(l=>l.id===key); if(bl){ bl.name=name; bl.nameHi=hiFinal; bl.unit=unit; saveBill(); }
    }).then(async j=>{
      if(j.conflicts && j.conflicts.length){ toast(t("conflictItem", j.conflicts[0].by)); S.rev=null; sync(); return; }
      mergeSaved(j.items);
      const realId=(j.items&&j.items[0]&&j.items[0].id)||key;
      if(imgChange){
        await photosReady;
        let th="";
        if(imgChange.length){ const c=imgChange[0]; th=c.thumb || (c.full||c.src ? await thumbFromData(c.full||c.src).catch(()=>"") : ""); if(!th) throw new Error("photo"); }
        const r=await write({action:"setImages",id:realId,thumb:th,photos:imgChange.map(p=>p.isNew?{data:p.full}:{k:p.k})});
        const x=S.byId.get(realId); if(x){ x.imgV=r.imgV; x.imgs=r.imgs||0;
          if(r.imgV){ S.thumbs[realId]={v:r.imgV,d:th}; idb.set("thumbs",realId,S.thumbs[realId]); imgChange.forEach((p,j)=>{ if(p.full) idb.set("images",photoKey(realId,j),{v:r.imgV,d:p.full}); }); }
          else { delete S.thumbs[realId]; idb.del("thumbs",realId); idb.del("images",realId); }
          afterLocal(); } }
      toast(t("saved")); resyncSoon();
    }).catch(()=>{});
  };
}

/* ---------------- Bulk add ---------------- */
function parseLines(txt){
  const rows=[];
  txt.split(/\r?\n/).forEach(line=>{ if(!line.trim()) return; const parts=(line.includes("\t")?line.split("\t"):line.split(/,|;|\|/)).map(s=>s.trim());
    const [name,unit,buy,sell,hi,hsn]=parts; if(!name) return;
    if(rows.length===0 && isNaN(toNum(buy)) && isNaN(toNum(sell)) && /item|name|सामान/i.test(name)) return;
    rows.push({name,unit:unitFromWord(unit)||unit||S.cfg.defaultUnit,buy:buy||"",sell:sell||"",hi:hi||"",hsn:(hsn||"").replace(/\s/g,"")}); });
  return rows;
}
function openBulkAdd(){
  const blank=()=>({name:"",unit:S.cfg.defaultUnit,buy:"",sell:"",hi:"",hsn:""});
  let rows=Array.from({length:5},blank);
  const tagFor=r=>{ const dup=r.name.trim()?findDup(r.name):null; const bad=r.name.trim()&&(isNaN(toNum(r.sell))||(r.buy!==""&&isNaN(toNum(r.buy)))); return bad?`<span class="tag bad">${esc(t("badRow"))}</span>`:dup?`<span class="tag">${esc(t("willUpdate"))}</span>`:""; };
  const rowHTML=(r,i)=>`<tr data-r="${i}"><td class="c-name"><input id="ba-n-${i}" data-f="name" value="${esc(r.name)}" autocomplete="off" enterkeyhint="next">${tagFor(r)}</td>
      <td class="c-unit">${unitBtnHTML("ba-u-"+i,r.unit,'data-ur="'+i+'"')}</td>
      <td class="c-num"><input id="ba-b-${i}" data-f="buy" class="money" data-dp="3" inputmode="decimal" value="${esc(moneyVal(r.buy,3))}"></td>
      <td class="c-num"><input id="ba-s-${i}" data-f="sell" class="money" data-dp="3" inputmode="decimal" value="${esc(moneyVal(r.sell,3))}"></td>
      <td class="c-name"><input id="ba-h-${i}" data-f="hi" value="${esc(r.hi)}" lang="hi"></td>
      <td class="c-unit"><input id="ba-x-${i}" data-f="hsn" inputmode="numeric" value="${esc(r.hsn||"")}" placeholder="${esc(S.cfg.defaultHsn||"3923")}"></td></tr>`;
  const valid=()=>rows.filter(r=>r.name.trim() && !isNaN(toNum(r.sell)) && (r.buy===""||!isNaN(toNum(r.buy))));
  const body=`<p class="note">${esc(t("bulkHelp"))}</p>
    <details id="ba-paste"><summary class="btn ghost" style="display:inline-flex">${esc(t("pasteList"))}</summary>
      <div style="display:grid;gap:8px;margin-top:8px"><textarea id="ba-txt" placeholder="Basmati Rice, kg, 85, 100&#10;Toor Dal, kg, 120, 140, तूर दाल"></textarea><div><button class="btn primary" id="ba-parse" type="button">${esc(t("parse"))}</button></div></div></details>
    <div class="gridwrap" style="margin-top:10px"><table class="g"><thead><tr><th>${esc(t("item"))}</th><th>${esc(t("unit"))}</th><th>${esc(t("buy"))} ₹</th><th>${esc(t("sell"))} ₹</th><th>${esc(t("hiName"))}</th><th>${esc(t("hsnShort"))}</th></tr></thead><tbody id="ba-body"></tbody></table></div>
    <div class="toolbar"><button class="btn ghost" id="ba-row" type="button">${esc(t("addRow"))}</button><span class="note" id="ba-prog"></span></div>`;
  openSheet(t("bulkAdd"), body, `<button class="btn ghost" id="ba-cancel">${esc(t("cancel"))}</button><button class="btn primary" id="ba-save"></button>`, {full:true});
  const tb=$("#ba-body");
  const draw=()=>{ tb.innerHTML=rows.map(rowHTML).join(""); upd(); };
  const upd=()=>{ const n=valid().length; const b=$("#ba-save"); b.textContent=t("saveN",n); b.disabled=!n; };
  tb.addEventListener("input",e=>{ const tr=e.target.closest("tr"); if(!tr||!e.target.dataset.f) return; rows[+tr.dataset.r][e.target.dataset.f]=e.target.value; upd(); });
  tb.addEventListener("change",e=>{ const tr=e.target.closest("tr"); if(!tr) return; const i=+tr.dataset.r; const cell=tr.querySelector(".c-name"); cell.querySelector(".tag")?.remove(); cell.insertAdjacentHTML("beforeend",tagFor(rows[i])); });
  tb.addEventListener("click",e=>{ const b=e.target.closest("[data-ur]"); if(b) onUnitBtn(b,v=>{ rows[+b.dataset.ur].unit=v; }); });
  $("#ba-row").onclick=()=>{ rows.push(blank()); draw(); $(`#ba-n-${rows.length-1}`)?.focus(); };
  $("#ba-parse").onclick=()=>{ const p=parseLines($("#ba-txt").value); if(!p.length) return; rows=[...rows.filter(r=>r.name.trim()),...p]; $("#ba-txt").value=""; $("#ba-paste").open=false; draw(); };
  $("#ba-cancel").onclick=sheetCancel;
  $("#ba-save").onclick=async()=>{
    const v=valid(); if(!v.length) return; if(navigator.onLine===false){ toast(t("offlineWrite")); return; }
    $("#ba-save").disabled=true; $("#ba-prog").textContent=t("saving");
    const seen=new Set();
    const recs=v.filter(r=>{ const k=phonTokens(r.name).join(" "); if(seen.has(k)) return false; seen.add(k); return true; }).map(r=>{
      const dup=findDup(r.name); const buy=r.buy===""?(dup?+dup.buy:0):toNum(r.buy);
      const hsn=String(r.hsn||"").replace(/\s/g,"");
      if(dup) return { id:dup.id, buy, sell:toNum(r.sell), unit:r.unit||dup.unit, ...(r.hi.trim()?{nameHi:r.hi.trim()}:(dup.nameHi?{}:{nameHi:toHindi(dup.name)})), ...(hsn?{hsn}:{}) };
      return withCat({ tmp:tmpId(), name:r.name.trim(), nameHi:r.hi.trim()||toHindi(r.name.trim()), unit:r.unit||S.cfg.defaultUnit, buy, sell:toNum(r.sell), hsn:hsn||S.cfg.defaultHsn||"3923", gst:+S.cfg.defaultGst });
    });
    try{
      for(let i=0;i<recs.length;i+=100){ const part=recs.slice(i,i+100); const j=await write({action:"upsert",items:part}); mergeSaved(j.items); const p=$("#ba-prog"); if(p) p.textContent=t("savingN",Math.min(i+100,recs.length),recs.length); }
      closeSheet(); toast(t("savedN",recs.length)); resyncSoon();
    }catch{ const b=$("#ba-save"); if(b) b.disabled=false; }
  };
  draw();
}

  openSheet(t("bulkEdit"), body, `<button class="btn ghost" id="be-cancel">${esc(t("cancel"))}</button><button class="btn primary" id="be-save"></button>`, {full:true});
  const tb=$("#be-body");
  const cell=(it,f)=>{ const ch=changes.get(it.id)?.[f]!==undefined; return `<input id="be-${f}-${esc(it.id)}" data-id="${esc(it.id)}" data-f="${f}" inputmode="decimal" class="${ch?"changed":""}${f==="buy"||f==="sell"?" money\" data-dp=\"3":""}" value="${esc(f==="buy"||f==="sell"?moneyVal(val(it,f),3):val(it,f))}">`; };
  const draw=()=>{ const v=visible(); tb.innerHTML=v.slice(0,300).map(it=>`<tr><td><input type="checkbox" data-sel="${esc(it.id)}" ${sel.has(it.id)?"checked":""} aria-label="Select"></td><td class="c-name">${esc(it.name)}</td><td class="c-unit">${unitBtnHTML("be-unit-"+it.id,val(it,"unit"),`data-uid="${esc(it.id)}"`).replace('class="unitbtn"',`class="unitbtn${changes.get(it.id)?.unit!==undefined?" changed":""}"`)}</td><td class="c-num">${cell(it,"buy")}</td><td class="c-num">${cell(it,"sell")}</td><td class="c-unit">${cell(it,"hsn")}</td><td class="c-num">${cell(it,"gst")}</td></tr>`).join(""); info(); };
  const info=()=>{ $("#be-sel").textContent = sel.size? t("selected",sel.size) : t("allShown"); const n=changes.size; const b=$("#be-save"); b.textContent=n?t("saveN",n):t("unchanged"); b.disabled=!n; };
  const setChange=(id,f,v)=>{ const it=S.byId.get(id); if(!it) return; const o=changes.get(id)||{}; const cur=f==="hsn"?itemHsn(it):f==="gst"?itemGst(it):it[f]; if(String(v)===String(cur)) delete o[f]; else o[f]=v; if(Object.keys(o).length) changes.set(id,o); else changes.delete(id); };
  tb.addEventListener("input",e=>{ const el=e.target; if(el.dataset.f){ let n; if(el.dataset.f==="hsn"){ n=el.value.replace(/\s/g,""); if(!n) return; } else { n=toNum(el.value); if(isNaN(n)) return; if(el.dataset.f==="gst"&&(n<0||n>100)) return; } setChange(el.dataset.id,el.dataset.f,n); el.classList.toggle("changed", changes.get(el.dataset.id)?.[el.dataset.f]!==undefined); info(); } });
  tb.addEventListener("change",e=>{ const id=e.target.dataset.sel; if(id){ e.target.checked?sel.add(id):sel.delete(id); info(); } });
  tb.addEventListener("click",e=>{ const b=e.target.closest("[data-uid]"); if(b) onUnitBtn(b,v=>{ setChange(b.dataset.uid,"unit",v); b.classList.toggle("changed",changes.get(b.dataset.uid)?.unit!==undefined); info(); }); });
  $("#be-which").addEventListener("click",e=>{ const b=e.target.closest("[data-w]"); if(!b) return; which=b.dataset.w; $("#be-which").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  $("#be-all").onchange=e=>{ visible().forEach(it=>e.target.checked?sel.add(it.id):sel.delete(it.id)); draw(); };
  let ft; $("#be-f").addEventListener("input",e=>{ filter=e.target.value; clearTimeout(ft); ft=setTimeout(draw,80); });
  $("#be-apply").onclick=()=>{ const p=toNum(String($("#be-pct").value).replace("%","")); if(isNaN(p)||p===0) return;
    const targets = sel.size ? [...sel].map(id=>S.byId.get(id)).filter(Boolean) : visible();
    targets.forEach(it=>{ (which==="both"?["buy","sell"]:[which]).forEach(f=>{ setChange(it.id,f,roundPrice((+val(it,f)||0)*(1+p/100))); }); });
    draw(); };
  $("#be-cancel").onclick=sheetCancel;
  $("#be-save").onclick=()=>{ if(!changes.size) return; if(navigator.onLine===false){ toast(t("offlineWrite")); return; }
    const recs=[...changes].map(([id,ch])=>({id,...ch})); const n=recs.length; const snapshot=S.items.map(x=>({...x}));
    closeSheet(); toast(t("saving"));
    write({action:"upsert",items:recs},()=>{ recs.forEach(r=>upsertLocal({...r,pending:true,updatedAt:Date.now(),updatedBy:byName()})); })
      .then(j=>{ mergeSaved(j.items); toast(t("savedN",n)); resyncSoon(); }).catch(()=>{ S.items=snapshot; afterLocal(); }); };
  draw();
}

    try{ const j=await write({action:"setConfig",config:data}); applyConfig(j.config||data); saveCache(); closeSheet(); renderAll(); toast(t("settingsSaved")); }catch(er){ btn.disabled=false; $("#cf-err").textContent=errMsg(er); } };

/* ---------------- Backups ---------------- */
let bkInfo=null;
const fmtDTs=d=>d?fmtDT(d):"";
async function loadBackupCard(){
  const box=$("#bk-body"); if(!box) return;
  $("#bk-now").onclick=async()=>{ const b=$("#bk-now"); btnBusy(b,true);
    try{ const j=await apiPost({action:"backupNow"}); bkInfo=j.info.backups; toast(t("bkDone")); renderBackupCard(); }
    catch(e){ toast(e&&/permission|authoriz|DriveApp|ScriptApp/i.test(e.code||"")?t("bkPerm"):t("bkFail")); }
    finally{ btnBusy($("#bk-now"),false); } };
  try{ const j=await apiPost({action:"backupInfo"}); bkInfo=j.backups; renderBackupCard(); }
  catch(e){ if($("#bk-body")) $("#bk-body").innerHTML=`<p class="note" style="margin:0">${esc(/permission|authoriz|DriveApp|ScriptApp/i.test(e&&e.code||"")?t("bkPerm"):t("bkFail"))}</p>`; }
}
function renderBackupCard(){
  const box=$("#bk-body"), b=bkInfo; if(!box||!b) return;
  box.innerHTML=`<div class="bk-status ${b.auto?"ok":"off"}"><span class="dot"></span><span>${b.auto?esc(t("bkAutoOn")):""}${b.auto&&b.last?" · ":""}${b.last?esc(t("bkLast",fmtDTs(b.last))):""}${b.count?` · ${esc(t("bkCopies",b.count))}`:""}${!b.last?esc((b.auto?" · ":"")+t("bkNone")):""}</span></div>
    ${b.auto?"":`<p class="note bk-warn">${esc(t("bkOff"))}</p>`}
    ${b.restoredAt?`<p class="note" style="margin:0">${esc(t("bkRestoredNote",fmtDTs(b.restoredAt),b.restoredFrom))}</p>`:""}

async function applyActions(actions){
  const todo=actions.filter(a=>a.on); if(!todo.length) return;
  for(const a of todo){ if(a.op==="add" && (!a.name.trim() || a.sell==null || isNaN(a.sell))){ toast(t("needRate")); return; } }
  if(navigator.onLine===false){ toast(t("offlineWrite")); return; }
  const go=$("#cmd-go"); go.disabled=true;
  const ups=[], dels=[];
  for(const a of todo){
    if(a.op==="delete"){ dels.push(a.id); continue; }
    if(a.op==="update"){ const it=S.byId.get(a.id); const ch={id:a.id}; if(a.buy!=null&&a.buy!==it.buy) ch.buy=a.buy; if(a.sell!=null&&a.sell!==it.sell) ch.sell=a.sell; if(a.unit&&a.unit!==it.unit) ch.unit=a.unit; if(Object.keys(ch).length>1) ups.push(ch); continue; }
    ups.push(withCat({ tmp:tmpId(), name:a.name.trim(), nameHi:a.nameHi||toHindi(a.name.trim()), unit:a.unit||S.cfg.defaultUnit, buy:a.buy==null?0:a.buy, sell:a.sell }));
  }
  try{
    if(ups.length){ const j=await write({action:"upsert",items:ups}); mergeSaved(j.items); }
    if(dels.length){ await write({action:"delete",ids:dels},()=>{ S.items=S.items.filter(x=>!dels.includes(x.id)); S.bill=S.bill.filter(l=>!dels.includes(l.id)); saveBill(); }); }
    closeSheet(); toast(t("appliedN",todo.length)); resyncSoon();
    if(looksLikeCommand(S.q)){ $("#q").value=""; onQuery(""); }
  }catch{ const b=$("#cmd-go"); if(b) b.disabled=false; }
}

function oldBillText(b){
  const d=b.date?new Date(b.date).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):"";
  let s=""; if(S.cfg.shopName) s+=`*${S.cfg.shopName}*\n`;
  s+=`${t("billNoLine",b.n)}${d?` · ${d}`:""}\n`; if(b.customer) s+=`${t("custL")}: ${b.customer}\n`; if(b.mobile) s+=`${t("mobL")}: ${b.mobile}\n`;
  const parts=String(b.items||"").split("; ").filter(Boolean);
  s+="\n"+parts.map((x,i)=>{ const m=x.match(/^(.*) ([\d.]+) (\S+) x ([\d.]+)(?: \[(.*)\])?$/);
    if(!m) return `${i+1}. ${x}`;
    const qty=+m[2], rate=+m[4];
    return `${i+1}. ${m[1].trim()}${m[5]?` (${m[5]})`:""} — ${qtyText(qty,m[3])} × ${rs(rate)}${isPart(qty,m[3])?"/"+unitL(m[3]):""} = ${rs(r2(qty*rate))}`; }).join("\n");
  if(b.gst && b.taxable!=null){ s+=`\n\n${t("taxable")}: ${rs2(b.taxable)}`; if(b.tax!=null) s+=`\nGST${b.igst?" (IGST)":" (CGST+SGST)"}: ${rs2(b.tax)}`; s+=`\n*${t("grandTotal")}: ${rs(b.total)}*\n_${t("inWordsL")}: ${inWords(b.total)}_`; }
  else s+=`\n\n*${t("total")}: ${rs(b.total)}*`;
  return s;
}

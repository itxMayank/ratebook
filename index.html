<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rate Book</title>
<meta name="description" content="Shop price list and quick bills">
<meta name="theme-color" content="#8C2331">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rate Book">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column counter app — sticky header + search, scrolling item list, fixed bottom tabs, bottom sheets for detail/edit. */
:root{
  --bg:#F5F4F2; --surface:#FFFFFF; --surface-2:#EDEBE8; --fg:#1E1B1A; --muted:#6C6560; --line:#E0DCD7;
  --accent:#8C2331; --accent-fg:#FFFFFF; --accent-soft:#F5E6E8; --gold:#B87A0B;
  --good:#2D7A4D; --danger:#B3261E; --shadow:0 1px 2px rgba(30,20,20,.06),0 6px 20px rgba(30,20,20,.08);
  --f-display:"Baloo 2","Mukta",system-ui,sans-serif;
  --f-body:"Mukta","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312; --surface:#1D1B1A; --surface-2:#2A2725; --fg:#F2EEEA; --muted:#A49C95; --line:#36312E;
  --accent:#E8848F; --accent-fg:#22090D; --accent-soft:#3B1F24; --gold:#E3B04B;
  --good:#6FC892; --danger:#F2867E; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1D1B1A; --surface-2:#2A2725; --fg:#F2EEEA; --muted:#A49C95; --line:#36312E;
  --accent:#E8848F; --accent-fg:#22090D; --accent-soft:#3B1F24; --gold:#E3B04B;
  --good:#6FC892; --danger:#F2867E; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{margin:0}
html,body{background:var(--bg);color:var(--fg)}
body{font:16px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.top>*{min-width:0}
.bar{display:flex;align-items:center;gap:10px}
.brand{font:700 24px/1 var(--f-display);letter-spacing:-.01em;margin:0;flex:1;min-width:0}
.brand small{font:500 13px var(--f-body);color:var(--muted);margin-left:6px;letter-spacing:0;white-space:nowrap}
.lang{display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:4px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.iconbtn{border:0;background:var(--surface-2);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}

.search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:4px 4px 4px 12px;box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--accent)}
.search svg.lead{width:20px;height:20px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:18px;padding:8px 2px}
.search input::-webkit-search-cancel-button{display:none}
.search .iconbtn{width:42px;height:42px;background:var(--accent-soft);color:var(--accent)}
.search .iconbtn.listening{background:var(--accent);color:var(--accent-fg);animation:pulse 1.2s infinite}
.search .clear{background:none;color:var(--muted)}
@keyframes pulse{50%{box-shadow:0 0 0 8px transparent,0 0 0 0 var(--accent)}0%{box-shadow:0 0 0 0 var(--accent-soft)}}

/* Lists */
main{padding:4px 16px 16px}
#view-items{padding-bottom:72px}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;padding:6px 2px}
.suggest{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;margin:4px 0 10px;display:grid;gap:8px}
.suggest p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:999px;padding:4px 12px;font-weight:600}
.list{display:grid;gap:8px}
.card{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:10px 10px 10px 10px;border:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 78px}
.card:active{background:var(--surface-2)}
.thumb{width:56px;height:56px;border-radius:10px;background:var(--surface-2);object-fit:cover;display:grid;place-items:center;font:700 22px var(--f-display);color:var(--muted);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.info{min-width:0}
.name{font-weight:600;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.name mark{background:none;color:var(--accent);font-weight:700}
.sub{color:var(--muted);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.rates{display:flex;gap:10px;margin-top:4px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.rates b{color:var(--fg);font-weight:600}
.price{text-align:right;display:grid;justify-items:end;gap:4px}
.sell{font:700 22px/1 var(--f-display);color:var(--accent)}
.per{font-size:12px;color:var(--muted)}
.addbtn{border:0;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:4px 10px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:4px}
.addbtn.in{background:var(--accent);color:var(--accent-fg)}
.more{width:100%;margin-top:10px;border:1.5px dashed var(--line);background:none;border-radius:var(--r);padding:12px;color:var(--muted);font-weight:600}
.empty{text-align:center;padding:36px 12px;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty h2{font:700 22px var(--f-display);color:var(--fg);margin:0}
.empty p{margin:0;max-width:34ch}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.skel{height:78px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* Buttons */
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:16px;background:var(--surface-2);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:none;border:1.5px solid var(--line)}
.btn.danger{background:none;color:var(--danger);border:1.5px solid currentColor}
.btn.wa{background:#1F8F4E;color:#fff}
.btn[disabled]{opacity:.5}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;border:0;border-radius:18px;height:56px;padding:0 20px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(140,35,49,.35)}
.fab svg{width:22px;height:22px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:13px;font-weight:600;position:relative}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-selected="true"]{color:var(--accent)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--accent);color:var(--accent-fg);font-size:11px;border-radius:999px;min-width:18px;padding:0 5px;line-height:18px}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(10,8,8,.45);z-index:40;opacity:0;transition:opacity .18s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:41;background:var(--surface);border-radius:20px 20px 0 0;max-height:min(92%,calc(var(--vvh,100vh) - 12px));display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);max-width:640px;margin:0 auto}
.sheet.full{height:min(96%,calc(var(--vvh,100vh) - 8px));max-height:min(96%,calc(var(--vvh,100vh) - 8px))}
.sheet.on{transform:none}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.sheet-h h2{font:700 20px var(--f-display);margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.sheet-b{overflow:auto;padding:4px 16px 16px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
@media (prefers-reduced-motion: reduce){.sheet,.scrim{transition:none}.skel,.listening{animation:none}}

.hero{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:var(--r);background:var(--surface-2);object-fit:cover;display:block}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--surface-2);border-radius:12px;padding:10px;min-width:0}
.kv span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv b{font:700 20px var(--f-display)}
.kv .s b{color:var(--accent)}
.note{color:var(--muted);font-size:14px}
.qtyrow{display:flex;align-items:center;gap:8px;margin-top:8px}
.step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.step button{border:0;background:var(--surface-2);width:40px;height:42px;font-size:20px;font-weight:700}
.step input{width:64px;text-align:center;border:0;background:none;height:42px;font-weight:700;font-size:17px;outline:none}

/* Forms */
.form{display:grid;gap:12px}
.field{display:grid;gap:4px}
.field label{font-size:14px;font-weight:600;color:var(--muted)}
.field input,.field select{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:17px;width:100%;min-width:0}
.field input:focus{border-color:var(--accent);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.img-pick{display:flex;gap:12px;align-items:center}
.img-pick .thumb{width:72px;height:72px}
.err{color:var(--danger);font-size:14px}
.confirm{background:var(--accent-soft);border-radius:12px;padding:12px;display:grid;gap:8px}

/* Grid editor */
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.g{border-collapse:collapse;width:100%;min-width:520px}
.g th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 6px;background:var(--surface-2);position:sticky;top:0}
.g td{padding:4px;border-top:1px solid var(--line);vertical-align:middle}
.g input[type=text],.g input:not([type]),.g input[inputmode]{width:100%;min-width:0;border:1.5px solid transparent;background:var(--bg);border-radius:8px;padding:8px;font-size:15px}
.g input:focus{border-color:var(--accent);outline:none}
.g input.changed{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--bg))}
.g .c-name{min-width:150px}
.g .c-num{width:84px}
.g .c-unit{width:84px}
.g .tag{font-size:11px;font-weight:700;color:var(--gold);display:block;padding:0 8px}
.g .tag.bad{color:var(--danger)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.toolbar input,.toolbar select{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:15px;min-width:0}
textarea{width:100%;min-height:140px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-size:15px;resize:vertical}

/* Bill */
.bill-line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.bill-line .name{font-size:16px}
.bill-line .ctrl{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bill-line .rate{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:14px}
.bill-line .rate input{width:76px;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;font-size:15px;text-align:right}
.bill-line .amt{font:700 18px var(--f-display)}
.x{border:0;background:none;color:var(--muted);margin-left:auto;padding:6px}
.total{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:12px;display:grid;gap:10px;box-shadow:var(--shadow)}
.total .sum{display:flex;justify-content:space-between;align-items:baseline}
.total .sum b{font:700 30px var(--f-display);color:var(--accent)}
.total .acts{display:flex;gap:8px;flex-wrap:wrap}
.total .acts>*{flex:1 1 auto}
.mini-results{display:grid;gap:6px;margin:8px 0}
.mini{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;width:100%;text-align:left}
.mini .name{flex:1;min-width:0;font-size:16px}
.mini .sell{font-size:18px}
.section-title{font:700 18px var(--f-display);margin:14px 0 6px}

.toast{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 14px;font-weight:500;transform:translateY(20px);opacity:0;transition:.2s;pointer-events:none;max-width:520px;margin:0 auto}
.toast.on{transform:none;opacity:1}
.menu-list{display:grid;gap:8px}
.menu-list button{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:14px}
.menu-list button b{display:block}
.menu-list button span{color:var(--muted);font-size:14px}
.menu-list svg{width:26px;height:26px;color:var(--accent);flex:none}
.ro{background:var(--surface-2);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:14px;margin-bottom:8px}

/* v2 additions */
body.typing .sheet-b{padding-bottom:42vh}
body.typing main{padding-bottom:42vh}
body.typing .tabs,body.typing .fab{display:none}
body.typing{padding-bottom:0}
.unitbtn{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:17px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-width:0}
.unitbtn::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);flex:none}
.g .unitbtn{padding:8px;font-size:15px;border-radius:8px;border-color:transparent}
.g .unitbtn.changed{border-color:var(--gold)}
.picker{position:fixed;inset:0;z-index:55;display:grid;place-items:end center;background:rgba(10,8,8,.45);padding:0 0 var(--kb,0px)}
.picker-card{background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-height:80%;overflow:auto}
.picker-card h3{margin:0;font:700 19px var(--f-display)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pick-grid button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 6px;display:grid;gap:2px;justify-items:center}
.pick-grid button b{font-size:16px}
.pick-grid button span{font-size:13px;color:var(--muted)}
.pick-grid button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pick-other{display:flex;gap:8px}
.pick-other input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:9px;padding:7px 12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mictip{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:15px}
.mictip .kb{flex:none;width:58px;height:40px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:5px;position:relative}
.mictip .kb i{background:var(--surface-2);border-radius:2px}
.mictip .kb i.m{background:var(--accent)}
.mictip p{margin:0;flex:1;min-width:0}
.mictip button{border:0;background:none;color:var(--muted);padding:4px}
.cmdhint{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--accent);border-radius:var(--r);padding:10px 12px;margin:4px 0 10px;width:100%;text-align:left}
.cmdhint svg{width:24px;height:24px;color:var(--accent);flex:none}
.cmdhint span{flex:1;min-width:0}
.cmdhint b{color:var(--accent)}
.act{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;background:var(--bg)}
.act.off{opacity:.5}
.act-h{display:flex;align-items:center;gap:8px}
.pill{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 10px}
.pill.add{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.update{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.pill.delete{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.act-h label{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.act input.t{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:16px;width:100%;min-width:0}
.act .three{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px}
.act .three label{display:grid;gap:2px;font-size:12px;color:var(--muted);min-width:0}
.act .was{font-size:13px;color:var(--muted)}
.act .was s{opacity:.8}
.examples{display:grid;gap:6px}
.examples button{border:1px dashed var(--line);background:none;border-radius:10px;padding:8px 10px;text-align:left;color:var(--muted);font-size:14px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25}}
.unit-chips{display:flex;flex-wrap:wrap;gap:8px}
.uchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;background:var(--bg)}
.uchip span{color:var(--muted);font-size:13px}
.uchip button{border:0;background:var(--surface-2);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;color:var(--muted)}
.cfg-sec{display:grid;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.cfg-sec h3{margin:0;font:700 17px var(--f-display)}
.addunit{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.addunit input{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-size:16px;min-width:0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch input{width:46px;height:28px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;flex:none;transition:.15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:21px}
@media (prefers-reduced-motion: reduce){.dots i{animation:none}}

/* returning customer + tap-to-reveal profit */
.custhint{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:6px 10px}
.custhint b{color:var(--accent)}
.custhint button{border:0;background:none;color:var(--accent);font-weight:700;padding:0 2px;margin-left:auto}
.tot-sum .profit.peek{color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.tot-sum .profit{cursor:pointer;background:none;border:0;padding:0;text-align:left}
/* profit (past bills only) */
.profit{font-size:13px;font-weight:700;color:var(--good)}
.profit.neg{color:var(--danger)}
.tot-sum .profit{color:var(--good);font-size:12px;font-weight:700}
.tot-sum .profit.neg{color:var(--danger)}
.profitbox{display:grid;gap:4px;background:color-mix(in srgb,var(--good) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--good) 35%,var(--line));border-radius:12px;padding:10px 12px;font-size:14px}
.profitbox .r{display:flex;justify-content:space-between;gap:8px}
.profitbox .r b{font-weight:700}
.profitbox .big{font:700 18px var(--f-display);color:var(--good)}
.profitbox .big.neg{color:var(--danger)}
.profitbox details{margin-top:4px}
.profitbox summary{cursor:pointer;color:var(--muted);font-size:13px}
.profitbox .pl{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);padding:2px 0}
/* compact bill header + total */
#mob-err:empty,#gstin-err:empty{display:none}
.billhead{gap:8px;padding:10px 12px}
.bh-row{display:flex;align-items:center;gap:8px;min-width:0}
.bh-no{border:0;background:none;padding:2px 0;display:flex;align-items:baseline;gap:6px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.05em;min-width:0}
.bh-no b{font:700 22px/1 var(--f-display);color:var(--accent);letter-spacing:0;text-transform:none}
.bh-no i{font-style:normal;font-size:12px;color:var(--gold);text-transform:none;letter-spacing:0}
.bh-chips{display:flex;gap:6px;margin-left:auto;align-items:center}
.chip-t{border:1.5px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:4px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.chip-t[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.chip-t.soft[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.iconbtn.sm{width:34px;height:34px;border-radius:10px}
.iconbtn.sm svg{width:20px;height:20px;transition:transform .15s}
[aria-expanded="true"] > svg{transform:rotate(180deg)}
.bh-cust{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}
.bh-cust input{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:16px;width:100%;min-width:0}
.bh-cust input:focus{border-color:var(--accent);outline:none}
#bh-extra{display:grid;gap:10px;padding-top:4px;border-top:1px dashed var(--line)}
.bh-field{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bh-field label{font-size:14px;color:var(--muted);font-weight:600}
.total{padding:10px 12px;gap:8px}
.tot-row{display:flex;align-items:center;gap:8px}
.tot-sum{flex:1;min-width:0;display:grid;line-height:1.1}
.tot-sum span{font-size:12px;color:var(--muted)}
.tot-sum b{font:700 24px/1.1 var(--f-display);color:var(--accent)}
.btn.sm{padding:9px 12px;font-size:15px;border-radius:10px;white-space:nowrap}
#tot-extra{display:grid;gap:10px}
#tot-extra .acts{display:flex;gap:8px}
#tot-extra .acts>*{flex:1}
.ro.lockline{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px}
.ro.lockline span{flex:1;min-width:0}
.ro.lockline .btn{padding:6px 12px;font-size:14px}
.ro.lockline .x{margin:0;padding:4px}
/* photo picker: real inputs behind labels, so a tap opens the camera or gallery on Android and iPhone */
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;opacity:0}
label.thumb{cursor:pointer}
.img-pick{position:relative;flex-wrap:wrap}
.img-pick .row-btns label.btn{cursor:pointer}
.img-pick .row-btns svg{width:18px;height:18px}
.ph-strip{display:flex;gap:10px;overflow-x:auto;padding:8px 8px 4px 0;-webkit-overflow-scrolling:touch}
.ph{position:relative;flex:none;width:76px;height:76px;border-radius:12px;background:var(--surface-2);cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
.ph-x{position:absolute;top:-7px;right:-7px;width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);background:var(--fg);color:var(--surface);font-size:12px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0;z-index:1}
.ph-x::before{content:"";position:absolute;inset:-9px}
.ph-cover{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.62);color:#fff;font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px;pointer-events:none}
.ph-add{display:grid;place-items:center;border:1.5px dashed var(--line);background:transparent;color:var(--muted)}
.ph-spin{position:absolute;inset:0;margin:auto}
/* (spin keyframes are in the loader kit) */
.gal-wrap{position:relative}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--r);scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal>.hero{flex:0 0 100%;scroll-snap-align:center}
.gal-n{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.58);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.img-busy{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
/* Loader kit: ring spinner, dots, skeleton shimmer, top progress bar */
.ld{--s:20px;display:inline-block;flex:none;width:var(--s);height:var(--s);border-radius:50%;background:conic-gradient(from 90deg,transparent 0 12%,var(--accent) 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));animation:spin .75s linear infinite;vertical-align:middle}
.ld.sm{--s:16px}.ld.lg{--s:34px}
.ld.on-dark{background:conic-gradient(from 90deg,transparent 0 12%,currentColor 100%)}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-block{display:grid;justify-items:center;gap:12px;padding:36px 12px;color:var(--muted);font-size:14px;text-align:center}
.ld-block span{animation:ldfade 1.6s ease-in-out infinite}
@keyframes ldfade{50%{opacity:.45}}
.skel{position:relative;overflow:hidden;background:var(--surface-2);border-radius:8px}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shimmer 1.3s ease-in-out infinite}
@media (prefers-color-scheme:dark){.skel::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent)}}
@keyframes shimmer{to{transform:translateX(100%)}}
.skel-card{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface)}
.skel-card .skel.a{width:56px;height:56px;border-radius:10px;grid-row:span 2}
.skel-card .skel.b{height:14px;width:70%}
.skel-card .skel.c{height:12px;width:40%}
.skel-card .skel.d{height:18px;width:54px;grid-row:span 2}
.skel-card.bill{grid-template-columns:1fr auto}
.topbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;pointer-events:none;opacity:0;transition:opacity .25s;overflow:hidden}
.topbar.on{opacity:1}
.topbar::before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-40%;border-radius:3px;background:linear-gradient(90deg,transparent,var(--accent),var(--gold));animation:topbar 1.1s cubic-bezier(.4,0,.2,1) infinite}
@keyframes topbar{to{left:100%}}
.btn .ld{--s:16px;margin-right:6px}
.btn.busy{pointer-events:none;opacity:.85}
.toast .ld{margin-right:8px;background:conic-gradient(from 90deg,transparent 0 12%,currentColor 100%)}
.mob-wrap{position:relative}
.mob-wrap .ld{position:absolute;right:12px;top:50%;margin-top:-8px}
.cust-hint.looking{color:var(--muted)}
.paybar{display:grid;gap:8px}
.bk-sec{display:grid;gap:10px}
.bk-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bk-status{display:flex;align-items:flex-start;gap:8px;font-size:14px}
.bk-status .dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--good)}
.bk-status.off .dot{background:var(--gold)}
.bk-warn{margin:0;color:var(--gold);font-weight:600}
.bk-mailrow{display:flex;gap:8px}
.bk-mailrow input{flex:1;min-width:0}
.bk-item{display:grid;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:10px 12px}
.bk-acts{display:flex;gap:8px}
.envbadge{display:inline-block;margin-left:8px;vertical-align:middle;font:800 11px/1 var(--f-body);letter-spacing:.08em;color:#fff;background:var(--gold);border-radius:6px;padding:4px 6px}
.envnote{font-size:13px;font-weight:600;color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:10px;padding:7px 12px;margin-bottom:10px}
.env-sec.test{border:1.5px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:var(--r);padding:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:3px;background:var(--surface-2);border-radius:12px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);padding:7px 4px;border-radius:9px;transition:background .15s,color .15s}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button[data-pay="credit"][aria-checked="true"],.seg button[data-pay="part"][aria-checked="true"]{color:var(--danger)}
.pay-part{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.pay-part input{width:110px;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;font:600 16px var(--f-body);color:var(--fg)}
.pay-due{margin-left:auto;font-weight:700;color:var(--danger)}
.need{border-color:var(--danger)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 18%,transparent)}
.duechip{display:inline-block;width:max-content;justify-self:start;align-self:flex-start;margin-left:0;font-size:12px;font-weight:700;color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent);border-radius:999px;padding:1px 8px;vertical-align:middle}
.custhint .due{color:var(--danger)}
.pill.due{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.pill.cleared{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.dues-sum{display:grid;gap:2px;padding:14px 16px;border-radius:var(--r);background:var(--accent-soft)}
.dues-sum b{font:700 30px/1.1 var(--f-display);color:var(--danger)}
.dues-sum span{font-size:14px;color:var(--muted)}
.duecard{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:10px 12px;color:var(--fg)}
.duecard .av{grid-row:span 2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font:700 17px var(--f-display);color:var(--accent)}
.duecard b{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duecard .amt{font:700 18px var(--f-display);color:var(--danger);text-align:right}
.duecard .m{font-size:13px;color:var(--muted)}
.duecard .age{font-size:12px;color:var(--muted);text-align:right}
.duecard .age.old{color:var(--danger);font-weight:700}
.payhist{display:grid;gap:6px;font-size:14px}
.payhist div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.payhist span{color:var(--muted)}
.paybox{display:grid;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--bg)}
.paybox .kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.paybox .kv3 span{display:block;font-size:12px;color:var(--muted)}
.paybox .kv3 b{font:700 17px var(--f-display)}
.paybox .kv3 .d{color:var(--danger)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:6px 12px;font:600 14px var(--f-body)}
.chips button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.preview{font-size:14px;color:var(--muted);display:grid;gap:2px}
/* bill editing */
.editbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--gold) 16%,var(--surface));border:1.5px solid var(--gold);border-radius:var(--r);padding:10px 12px;margin-top:6px}
.editbar span{flex:1;min-width:0;font-weight:600}
.pill.edited{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.editnote{font-size:13px;color:var(--gold);font-weight:600}
.bl-sum{font-size:14px;color:var(--muted);margin-top:8px}
.bl-bar{position:sticky;top:-4px;z-index:3;background:var(--surface);padding:4px 0 8px;margin-top:-4px;display:grid;gap:8px}
.bl-bar input[type=search]{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px;color:var(--fg)}
.bl-chips{display:flex;gap:8px;align-items:center}
.bl-chip{position:relative;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);color:var(--fg);font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer}
.bl-chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.bl-chip select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:inherit;font:inherit;padding:0 14px 0 0;height:100%;outline:0;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:right 4px center,right 0 center;background-size:4px 4px;background-repeat:no-repeat}
.bl-chip input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;cursor:pointer;font-size:16px}
.bl-clear{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);color:var(--muted);font-size:14px;flex:none}
.bl-grp{display:grid;gap:8px}
.bl-gb{display:grid;gap:8px}
.bl-grp.shut>.bl-gb{display:none}
.bl-mh,.bl-day{position:sticky;display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;cursor:pointer;color:var(--fg)}
.bl-mh{top:var(--blh,96px);z-index:3;padding:9px 12px;border-radius:12px;background:var(--accent-soft);font:700 15px var(--f-display)}
.bl-mh .num{color:var(--accent)}
.bl-day{top:calc(var(--blh,96px) + 44px);z-index:2;padding:7px 12px;border-radius:10px;background:var(--surface-2);font-size:13px;font-weight:700}
.bl-day .num{color:var(--muted);font-weight:600}
.bl-ml{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl-mh .num,.bl-day .num{white-space:nowrap}
.bl-mh>.chev,.bl-day>.chev{flex:none;transition:transform .18s;transform:none}
.bl-grp.shut>button>.chev{transform:rotate(-90deg)}
.bl-month+.bl-month{margin-top:4px}
/* past bills + pack units */
.unitchip{border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px}
.bills-list{display:grid;gap:8px;margin-top:10px}
.billcard{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:10px 12px;width:100%}
.billcard b{font-size:16px}
.billcard .amt{font:700 18px var(--f-display);color:var(--accent);text-align:right}
.billcard .meta2{grid-column:1/-1;color:var(--muted);font-size:13px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
pre.billtext{white-space:pre-wrap;word-break:break-word;font:14px/1.45 var(--f-body);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0;max-height:46vh;overflow:auto}
.sendrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
details.alt summary{cursor:pointer;color:var(--accent);font-weight:600;padding:4px 0}
/* GST + compact stepper */
.mstep{display:inline-flex;align-items:center;background:var(--accent);color:var(--accent-fg);border-radius:10px;overflow:hidden;height:30px}
.mstep button{border:0;background:none;color:inherit;width:30px;height:30px;font-size:18px;font-weight:700;line-height:1;padding:0}
.mstep span{min-width:24px;text-align:center;font-weight:700;font-size:14px}
.gstrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gstrow .switch{flex:1;min-width:150px}
.billno input{width:110px;text-align:right;font:700 26px/1 var(--f-display);color:var(--accent);border:1.5px dashed var(--line);background:none;border-radius:10px;padding:4px 8px}
.billno input:focus{border-style:solid;border-color:var(--accent);outline:none}
.billno .auto{font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0}
.billno .auto button{border:0;background:none;color:var(--accent);font-weight:600;padding:0 2px}
.taxline{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-top:2px}
.hsned{display:inline-flex;align-items:center;gap:4px}
.hsned input{width:8.5ch;font:600 12px var(--f-body);color:var(--fg);background:var(--bg);border:1px dashed var(--muted);border-radius:6px;padding:2px 6px;font-variant-numeric:tabular-nums}
.hsned input:focus{border-style:solid;border-color:var(--accent);outline:0}
.inwords{grid-column:1/-1;font-size:12px;font-style:italic;color:var(--muted);line-height:1.35}
.gstsum{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.gstsum div{display:flex;justify-content:space-between}
.gstsum b{color:var(--fg);font-weight:600}
.pill.gst{background:var(--accent-soft);color:var(--accent)}
/* bill header */
.billhead{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:6px}
.billno{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.billno span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.billno b{font:700 26px/1 var(--f-display);color:var(--accent)}
.billno small{color:var(--muted);font-size:13px}
.lastbill{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);padding:8px 2px 0}
.lastbill a,.lastbill button{color:var(--accent);font-weight:600;background:none;border:0;padding:2px 4px;text-decoration:none}
.field .err{font-size:13px}
/* v3 standalone */
.banner{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:4px 0 10px}
.banner img{width:44px;height:44px;border-radius:10px;flex:none}
.banner .txt{flex:1;min-width:0;font-size:15px}
.banner .txt b{display:block;font-size:16px}
.banner .txt span{color:var(--muted)}
.banner .x{margin:0;align-self:flex-start}
.banner.ios .share{display:inline-block;vertical-align:-3px;width:16px;height:18px}
.netbar{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);padding:2px 2px 0}
.netbar .dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.netbar.off .dot{background:var(--gold)}
.netbar button{border:0;background:none;color:var(--accent);font-weight:600;padding:2px 4px;margin-left:auto}
.card.pending{opacity:.6}
.setup{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.setup h2{margin:0;font:700 20px var(--f-display)}
.setup p{margin:0;color:var(--muted)}
.setup input{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px;width:100%;min-width:0}
.lockline{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.cmd-mic{display:flex;gap:8px;margin-top:8px}
.cmd-mic .btn{flex:1}
.btn.listening{background:var(--accent);color:var(--accent-fg);animation:pulse 1.2s infinite}

/* ===================== Design refresh: soft cards, ink pills, floating tab bar ===================== */
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --surface-2:#EEF0F3; --fg:#16171A; --muted:#6E727A; --line:#E3E5E9;
  --ink:#16171A; --ink-fg:#FFFFFF; --ink-2:#2A2C31;
  --accent:#9B2335; --accent-fg:#FFFFFF; --accent-soft:#F7E8EA;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.07);
  --shadow-lg:0 12px 40px rgba(16,24,40,.14);
  --f-display:"Plus Jakarta Sans","Mukta",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Mukta","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0F11; --surface:#18191C; --surface-2:#222428; --fg:#F3F4F6; --muted:#9CA0A8; --line:#2A2C31;
  --ink:#F3F4F6; --ink-fg:#111214; --ink-2:#D9DBE0; --accent:#F08A97; --accent-fg:#2A0A10; --accent-soft:#3A1E24;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4); --shadow-lg:0 12px 40px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{
  --bg:#0E0F11; --surface:#18191C; --surface-2:#222428; --fg:#F3F4F6; --muted:#9CA0A8; --line:#2A2C31;
  --ink:#F3F4F6; --ink-fg:#111214; --ink-2:#D9DBE0; --accent:#F08A97; --accent-fg:#2A0A10; --accent-soft:#3A1E24;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4); --shadow-lg:0 12px 40px rgba(0,0,0,.6)}
body{background:var(--bg);color:var(--fg);letter-spacing:-.005em}
/* header: greeting + shop name */
.brand{font:800 21px/1.2 var(--f-display);letter-spacing:-.02em}
.brand #shopname{display:inline-block;max-width:calc(100% - 64px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.brand #count{display:none}
.brand .hello{display:block;font:500 13px/1.3 var(--f-body);color:var(--muted);letter-spacing:0;margin-bottom:2px}
.iconbtn{background:var(--surface);border-radius:999px;box-shadow:var(--shadow);width:42px;height:42px}
.lang{background:var(--surface);box-shadow:var(--shadow)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);box-shadow:none}
/* search: white pill, dark round mic */
.search{border:0;border-radius:999px;padding:5px 5px 5px 16px;box-shadow:var(--shadow)}
.search:focus-within{box-shadow:0 0 0 2px var(--ink),var(--shadow)}
.search input{font-size:17px}
.search .iconbtn{background:var(--ink);color:var(--ink-fg);box-shadow:none;width:44px;height:44px}
.search .iconbtn.listening{background:var(--accent);color:var(--accent-fg)}
.search .iconbtn.clear{box-shadow:none;background:var(--line);color:var(--ink);width:30px;height:30px;flex:none;align-self:center}
.search .iconbtn.clear svg{width:16px;height:16px}
/* filter chips */
.fchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:8px 2px 2px;margin:0 -2px}
.fchips::-webkit-scrollbar{display:none}
.rates .sold{color:var(--muted);font-weight:600}
.fchip.sortchip{margin-left:auto;display:inline-flex;align-items:center;gap:5px;border-style:dashed}
.fchip{flex:none;border:0;background:var(--surface);color:var(--fg);border-radius:999px;padding:9px 16px;font:600 14px var(--f-body);box-shadow:var(--shadow);transition:background .15s,color .15s}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg)}
.fchip .n{margin-left:6px;opacity:.6;font-weight:700}
.meta{padding:10px 4px 6px;font-size:13px}
/* cards */
.list{gap:10px}
.card{border:0;border-radius:var(--r);padding:10px 12px 10px 10px;box-shadow:var(--shadow);grid-template-columns:60px 1fr auto;transition:transform .12s ease}
.card:active{transform:scale(.985);background:var(--surface)}
.thumb{width:60px;height:60px;border-radius:16px;font:800 22px var(--f-display);background:var(--surface-2)}
.name{font-weight:700;font-size:16px;letter-spacing:-.01em}
.rates{font-size:13px}
.sell{font:800 21px/1 var(--f-display);color:var(--fg);letter-spacing:-.02em}
.addbtn{background:var(--ink);color:var(--ink-fg);border-radius:999px;padding:6px 12px;font-size:13px}
.addbtn.in{background:var(--accent);color:var(--accent-fg)}
.mini,.card .mstep{border-radius:999px}
/* buttons */
.btn{border-radius:999px;padding:12px 20px}
.btn.primary{background:var(--ink);color:var(--ink-fg)}
.btn.ghost{border:0;background:var(--surface-2)}
.btn.danger{border:1.5px solid currentColor;background:none}
.btn.wa{background:#1DAA61}
.btn.sm{border-radius:999px}
.fab{border-radius:999px;background:var(--ink);color:var(--ink-fg);box-shadow:var(--shadow-lg)}
/* inputs */
input:not([type=checkbox]):not([type=radio]):not([type=file]),textarea,select{border-radius:14px}
.field input,.field textarea,.form input,.form textarea,.bh-cust input,.pay-part input{border:0!important;background:var(--surface-2)!important;border-radius:14px}
.field input:focus,.field textarea:focus,.form input:focus,.bh-cust input:focus,.pay-part input:focus{outline:0;box-shadow:0 0 0 2px var(--ink)}
.need{box-shadow:0 0 0 2px var(--danger)!important}
/* sheets */
.scrim{background:rgba(10,12,16,.5)}
.sheet{border-radius:28px 28px 0 0}
.sheet-h h2{font:800 20px var(--f-display);letter-spacing:-.02em}
.sheet-h .iconbtn,#sheet-close{background:var(--surface-2);box-shadow:none}
.grab{background:var(--line)}
/* item screen with a photo: full-bleed picture, round buttons over it */
.sheet.hero-mode .sheet-h{position:absolute;top:0;left:0;right:0;z-index:3;padding:14px 16px;background:linear-gradient(rgba(0,0,0,.35),transparent)}
.sheet.hero-mode .sheet-h h2{visibility:hidden}
.sheet.hero-mode .sheet-h .iconbtn,.sheet.hero-mode #sheet-close{background:rgba(255,255,255,.92);color:#111;box-shadow:var(--shadow)}
.sheet.hero-mode .grab{position:absolute;z-index:4;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.7)}
.sheet.hero-mode .sheet-b{padding-top:0}
.sheet.hero-mode .gal-wrap{margin:0 -16px;border-radius:28px 28px 0 0;overflow:hidden}
.sheet.hero-mode .gal,.sheet.hero-mode .hero{border-radius:0}
.sheet.hero-mode .hero{aspect-ratio:5/4}
.d-card{position:relative;margin:-26px -16px 0;background:var(--surface);border-radius:26px 26px 0 0;padding:18px 16px 0;display:grid;gap:4px}
.d-title{font:800 24px/1.15 var(--f-display);letter-spacing:-.02em;margin:0}
.kv>div{border-radius:16px;background:var(--surface-2)}
/* segmented controls: ink pill */
.seg{background:var(--surface-2);border-radius:999px;padding:4px}
.seg button{border-radius:999px}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--ink-fg);box-shadow:none}
.seg button[data-pay="credit"][aria-checked="true"],.seg button[data-pay="part"][aria-checked="true"]{background:var(--danger);color:#fff}
/* bill */
.billhead{border:0;border-radius:var(--r);box-shadow:var(--shadow)}
.bh-no b{font-family:var(--f-display);font-weight:800}
.chip-t{border-radius:999px}
.chip-t[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.bill-line{border:0;border-radius:var(--r);box-shadow:var(--shadow)}
.total{border:0;border-radius:24px;box-shadow:var(--shadow-lg)}
.total #bill-sum{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em}
.step{border-radius:999px;overflow:hidden}
.custhint{border-radius:14px}
/* tools & lists */
.menu-list button{border:0;border-radius:var(--r);box-shadow:var(--shadow);background:var(--surface)}
.menu-list button svg{background:var(--surface-2);border-radius:12px;padding:8px;width:40px;height:40px;flex:none;box-sizing:border-box}
.billcard,.duecard,.bk-item{border:0;border-radius:var(--r);box-shadow:var(--shadow);background:var(--surface)}
.bl-mh{border-radius:999px;background:var(--ink);color:var(--ink-fg)}
.bl-mh .num{color:var(--ink-fg);opacity:.8}
.bl-day{border-radius:999px}
.bl-chip{border:0;box-shadow:var(--shadow);background:var(--surface)}
.bl-chip.on{background:var(--ink);color:var(--ink-fg)}
.bl-bar input[type=search]{border:0;border-radius:999px;box-shadow:var(--shadow);background:var(--surface)}
.dues-sum{border-radius:24px;background:var(--ink);color:var(--ink-fg)}
.dues-sum span{color:var(--ink-fg);opacity:.75}
.dues-sum b{color:var(--ink-fg)}
.chips button.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.paybox,.cfg-sec.env-sec.test{border-radius:var(--r)}
.toast{border-radius:999px;padding:12px 18px;text-align:center;background:var(--ink);color:var(--ink-fg);box-shadow:var(--shadow-lg)}
.envbadge{border-radius:999px;padding:4px 8px}
.netbar .dot{box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 18%,transparent)}
/* floating tab bar (phones only) */
@media (max-width:1023px){
  body{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
  .tabs{left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));border:0;border-radius:999px;background:var(--ink);padding:6px;gap:4px;box-shadow:var(--shadow-lg)}
  .tabs button{color:color-mix(in srgb,var(--ink-fg) 62%,transparent);border-radius:999px;padding:8px 0 7px;font-size:12px;transition:background .18s,color .18s}
  .tabs button[aria-selected="true"]{background:var(--ink-fg);color:var(--ink)}
  .tabs .badge{background:var(--accent);color:var(--accent-fg);box-shadow:0 0 0 2px var(--ink)}
  .tabs button[aria-selected="true"] .badge{box-shadow:0 0 0 2px var(--ink-fg)}
  .fab{bottom:calc(98px + env(safe-area-inset-bottom,0px))}
  .total{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(170px + env(safe-area-inset-bottom,0px))}
  body.typing .tabs{display:none}
}

/* ---- v2 tweaks: smaller floating controls, clearer bill items ---- */
.addbtn{padding:5px 10px;font-size:12.5px}
.fab{height:48px;padding:0 16px;font-size:15px;gap:4px}
/* Phones: while the search box is focused but still empty, keep the tab bar and Add button (above the keyboard).
   They hide once something is typed and results appear. */
@media (max-width:1023px){
  body.typing.qe .tabs{display:grid;bottom:calc(var(--kb,0px) + 12px + env(safe-area-inset-bottom,0px))}
  body.typing.qe .fab{display:flex;bottom:calc(var(--kb,0px) + 98px + env(safe-area-inset-bottom,0px))}
  body.typing.qe .fab[hidden]{display:none}
}
.fab svg{width:19px;height:19px}
@media (max-width:1023px){
  body{padding-bottom:calc(88px * var(--fz2,1) + env(safe-area-inset-bottom,0px))}
  .tabs{left:28px;right:28px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:4px;gap:2px}
  .tabs button{padding:5px 0 4px;font-size:11px;gap:1px}
  .tabs button svg{width:21px;height:21px}
  .tabs .badge{top:0;font-size:10px;min-width:16px;line-height:16px}
  .fab{bottom:calc(76px * var(--fz2,1) + env(safe-area-inset-bottom,0px))}
  .total{bottom:calc((80px * var(--fz2,1) + env(safe-area-inset-bottom,0px)) / var(--fz,1))}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
}
/* bill items: numbered, outlined, × always on the quantity row */
#bill-lines{counter-reset:bl}
.bill-line{counter-increment:bl;border:1.5px solid var(--line)!important;box-shadow:none!important;padding:10px 12px;gap:8px 10px}
.bill-line .name{font-size:16px;font-weight:700;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:start}
.bill-line .name::before{content:counter(bl);grid-row:span 2;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--ink-fg);font:800 13px/26px var(--f-display);text-align:center;margin-top:-1px}
.bill-line .name .sub{grid-column:2}
.bill-line .amt{font:800 18px var(--f-display);color:var(--fg);letter-spacing:-.02em}
.bill-line .ctrl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;flex-wrap:nowrap}
.bill-line .ctrl>.note,.bill-line .ctrl>.unitchip{display:none}
.bill-line .ctrl .uwrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.bill-line .step button{width:36px;height:38px;font-size:19px}
.bill-line .step input{width:46px;height:38px;font-size:16px}
.bill-line .step{border:1.5px solid var(--line)}
.bill-line .rate{font-size:13px;gap:3px;color:var(--muted)}
.bill-line .rate input{width:66px;padding:7px 8px;font-size:15px;font-weight:600;color:var(--fg);background:var(--surface-2);border:0;border-radius:10px}
.bill-line .uwrap .note{font-size:13px;color:var(--muted)}
.bill-line .x{margin:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);padding:0}
.bill-line .x svg{width:16px;height:16px}
/* long shop names: up to 2 lines instead of cutting to "P…" */
.brand #shopname{white-space:normal;display:-webkit-inline-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:calc(100% - 62px);vertical-align:middle}
html.fz-big .brand .hello{display:none}
html.fz-big #cmd-open{display:none!important}   /* the wand is also in Tools */
html.fz-big #wa-label{display:none}
html.fz-big #bill-wa{padding-left:14px;padding-right:14px}
/* total bar: buttons wrap under the total when text is large */
.tot-row{flex-wrap:nowrap;gap:6px}
.tot-row .tot-sum{min-width:0}
html.fz-big .tot-row .btn.sm{padding:8px 12px}
html.fz-big .tot-row .iconbtn{width:34px;height:34px}
.bill-line .rate{white-space:nowrap;min-width:0}
/* price and number boxes: centred */
.bill-line.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
/* Open (held) bills: a chip per bill, only shown when more than one bill is open */
.heldrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 10px;margin:0 -2px;scroll-snap-type:x proximity}
.heldrow::-webkit-scrollbar{display:none}
.heldrow[hidden]{display:none}
.hchip{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:92px;max-width:170px;padding:7px 12px 7px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hchip .hn{font-weight:700;font-size:14px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hchip .ht{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.hchip .ht b{color:inherit;font-weight:700}
.hchip.on{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.hchip.on .ht{color:var(--ink-fg);opacity:.75}
.hchip .old{position:absolute;top:-6px;right:8px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--warn,#c98a00);color:#fff}
.hchip.add{min-width:0;justify-content:center;align-items:center;flex-direction:row;gap:4px;border-style:dashed;color:var(--muted);font-weight:700;font-size:14px}
.hchip:active{transform:scale(.97)}
.chip-t.newb{display:inline-flex;align-items:center;gap:4px;color:var(--ink);border-style:dashed}
.chip-t.newb[hidden]{display:none}
#bh-no{white-space:nowrap}
.bi-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bi-head .chip-t.newb{padding:6px 12px;font-size:13px}
.addto{display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0;max-width:100%;overflow:hidden;box-sizing:border-box;margin:0 0 8px;padding:6px 12px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:13px;font-weight:600;border:0;width:100%;text-align:left;cursor:pointer}
.addto[hidden]{display:none}
.addto .at-l{flex:none;color:var(--muted)}
.addto .at-n{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
.addto .at-m{flex:none;margin-left:auto;color:var(--muted);font-weight:700;white-space:nowrap}
/* Cash given -> change to return */
.cashrow{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0;border-top:1px dashed var(--line);padding-top:8px}
.cash-in{display:flex;align-items:center;gap:4px;flex:none;font-size:12px;font-weight:600;color:var(--muted)}
.cash-in .rs{color:var(--ink);font-weight:700;font-size:14px;margin-left:2px}
.cash-in input{width:74px;height:34px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font:700 16px var(--f-body,inherit);color:var(--ink);padding:0 6px}
.cash-in input:focus{border-color:var(--accent);outline:0}
.cash-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.cash-chips::-webkit-scrollbar{display:none}
.cashrow[hidden],.cash-chips[hidden],.cash-res[hidden]{display:none}
.cash-chips button{flex:none;height:32px;padding:0 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.cash-chips button:active{transform:scale(.96)}
.cash-res{flex:1 1 auto;display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.cash-res .pill{margin-left:auto;display:inline-flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:12px;font-weight:700;white-space:nowrap;animation:cashpop .25s ease-out}
.cash-res .pill small{font-size:12px;font-weight:600;opacity:.85}
.cash-res .pill b{font:700 20px/1 var(--f-display,inherit)}
.cash-res .pill.ret{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.cash-res .pill.short{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.cash-res .pill.exact{background:var(--accent-soft);color:var(--ink)}
.cash-res .x{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:var(--line);color:var(--ink);display:grid;place-items:center;cursor:pointer}
@keyframes cashpop{0%{transform:scale(.9);opacity:.4}100%{transform:none;opacity:1}}
/* clear (x) button on every search box */
.sx{position:relative;display:block}
.sx>input{padding-right:40px!important}
.sx>input::-webkit-search-cancel-button{display:none}
.sx>.sx-b{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:var(--line);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.sx>.sx-b[hidden]{display:none}
input[inputmode="decimal"],input.num,.bill-line .rate input,.billno input,#bill-no,#pay-recv,#rp-amt,.gridwrap input,.t.num{text-align:center!important}
.bill-line .rate input{flex:0 1 66px;min-width:50px;width:66px}
html.fz-big .bill-line .rate input{width:58px;flex-basis:58px}
html.fz-big .bill-line .step input{width:40px}
.tot-row .btn.sm{flex:none}
/* text size (this phone): --fz scales content, --fz2 scales the floating controls half as much */
:root{--fz:1;--fz2:1}
.top,#view-items,#view-tools,#view-bill,.netbar,#install-wrap,.sheet-h,.sheet-b,.sheet-f,.picker-card,.toast{zoom:var(--fz)}
@media (max-width:1023px){ .tabs,.fab{zoom:var(--fz2)} }
.tsize{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface-2);border-radius:16px;padding:4px}
.tsize button{border:0;background:transparent;border-radius:12px;padding:8px 0 6px;display:grid;justify-items:center;gap:2px;color:var(--fg)}
.tsize button b{font-family:var(--f-display);font-weight:800;line-height:1}
.tsize button span{font-size:11px;color:var(--muted)}

function translit(str){
  if(!/[ऀ-ॿ]/.test(str)) return str;
  const s=str.normalize("NFD"); let o="";
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(DC[c]){ let cons=DC[c]; if(s[i+1]==="़"){ cons=DN[c]||cons; i++; }
      const n=s[i+1];
      if(DM[n]){ o+=cons+DM[n]; i++; } else if(n==="्"){ o+=cons; i++; } else o+=cons+"a";
    } else if(DV[c]) o+=DV[c];
    else if(c==="ं"||c==="ँ") o+="n";
    else if(c==="ः") o+="h";
    else if(c>="०"&&c<="९") o+=String(c.charCodeAt(0)-0x966);
    else if(c==="़") {}

  }

function lev(a,b,max){
  if(a===b) return 0; const al=a.length, bl=b.length; if(Math.abs(al-bl)>max) return max+1;
  let prev=new Array(bl+1); for(let j=0;j<=bl;j++) prev[j]=j;
  for(let i=1;i<=al;i++){ const cur=[i]; let best=i;
    for(let j=1;j<=bl;j++){ const v=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); cur[j]=v; if(v<best) best=v; }

function tokScore(q,toks){
  let best=0; const allow=q.length<=2?0:q.length<=4?1:2;
  for(const tk of toks){
    let s=0;
    if(tk===q) s=120;
    else if(tk.startsWith(q)) s=100-Math.min(20,tk.length-q.length);
    else if(q.length>=2 && tk.includes(q)) s=72;
    else if(allow){ const d=lev(q,tk.slice(0,q.length),allow); if(d<=allow) s=56-12*d; else { const d2=lev(q,tk,allow); if(d2<=allow) s=50-12*d2; } }
    if(!s && q.length>=3){ const sq=skel(q), st=skel(tk); if(sq.length>=3){ if(st===sq) s=54; else if(st.startsWith(sq)) s=50; } }
    if(s>best) best=s; if(best>=120) break;
  }
  return best;
}
/* Item order: "Most sold" = how many real bills an item was on (from the sheet, not quantity), then A–Z.
   The count comes with the price list (S.pop) and only changes when the list reloads, so cards don't jump while billing. */
const popN=id=>(S.pop && +S.pop[id])||0;
const nameCmp=(a,b)=>a.name.localeCompare(b.name,"en",{sensitivity:"base"});
function sortItems(arr){ if(S.sortBy==="az" || !S.pop) arr.sort(nameCmp); else arr.sort((a,b)=>popN(b.id)-popN(a.id) || nameCmp(a,b)); return arr; }
function setSort(m){ S.sortBy=m; ls.set("rb_sort",m); sortItems(S.items); buildIndex(); S.limit=40; renderList(); window.scrollTo({top:0}); }
function buildIndex(){
  S.index = S.items.map(it => { const toks=[...phonTokens(it.name),...phonTokens(it.nameHi)]; return { it, toks, key: phonTokens(it.name).join(" ") }; });
}
function runSearch(q){
  const qt=phonTokens(q);
  if(!qt.length) return { res:S.index.map(e=>({e,score:0})), suggest:[], exact:true };
  const joined=qt.join(" "); const out=[];
  for(const e of S.index){
    let total=0, fuzzy=false;
    for(const tq of qt){ const s=tokScore(tq,e.toks); if(s<=0){ total=-1; break; } if(s<60) fuzzy=true; total+=s; }
    if(total>0){ if(e.key.startsWith(joined)) total+=30; out.push({e,score:total,fuzzy}); }
  }
  out.sort((a,b)=>b.score-a.score || (S.sortBy==="az"?0:popN(b.e.it.id)-popN(a.e.it.id)) || a.e.it.name.localeCompare(b.e.it.name));
  let suggest=[];
  const exact = out.some(o=>!o.fuzzy);
  if(exact) return { res:out.filter(o=>!o.fuzzy), suggest, exact };
  if(out.length){ suggest=out.slice(0,4).map(o=>o.e.it); }
  else {
    const L=Math.max(joined.replace(/ /g,"").length,1);
    const cand=S.index.map(e=>{ let tsum=0; for(const tq of qt){ let b=tq.length; for(const tk of e.toks){ const dd=lev(tq,tk.slice(0,tq.length+1),tq.length); if(dd<b) b=dd; } tsum+=b; } return {e,sim:1-tsum/L}; })
      .filter(x=>x.sim>=0.45).sort((a,b)=>b.sim-a.sim).slice(0,4);
    suggest=cand.map(x=>x.e.it); out.push(...cand.map(x=>({e:x.e,score:x.sim,fuzzy:true})));
  }
  return { res:out, suggest, exact };
}
function highlight(name,q){
  const raw=String(q||"").trim().toLowerCase(); if(!raw) return esc(name);
  const idx=name.toLowerCase().indexOf(raw);
  if(idx<0) return esc(name);
  return esc(name.slice(0,idx))+"<mark>"+esc(name.slice(idx,idx+raw.length))+"</mark>"+esc(name.slice(idx+raw.length));
}
function findDup(name,exceptId){ const k=phonTokens(name).join(" "); if(!k) return null; return S.index.find(e=>e.key===k && e.it.id!==exceptId)?.it || null; }

/* ---------------- Plain-language commands ---------------- */
const RE_ADD=/\b(add|new|create|insert)\b|जोड़|जोड|\bjod(o|do|en|ein)?\b|\bnaya\b|नया|नई/i;
const RE_DEL=/\b(delete|remove|hatao|hata do|mitao)\b|हटा|मिटा/i;
const RE_UPD=/\b(update|change|set|edit|make|increase|raise|decrease|reduce|badlo|badal do|kar do|karo|badha|badhao|badha do|ghata|ghatao)\b|बदल|कर दो|करो|कर दें|बढ़ा|बढ़ा|बढा|घटा/i;
const RE_VERBWORD=/[\u0900-\u097F]*(?:जोड़|जोड़|जोड|बदल|हटा|मिटा|बढ़ा|बढ़ा|बढा|घटा)[\u0900-\u097F]*/g;
const RE_DOWN=/\b(decrease|reduce|less|lower|kam|ghata|ghatao|down|minus)\b|कम|घटा/i;
function looksLikeCommand(q){ const s=q.trim(); if(s.length<6) return false; return (RE_ADD.test(s)||RE_UPD.test(s)||RE_DEL.test(s)) && (/\d|[०-९]/.test(s)||RE_DEL.test(s)); }
function unitFromWord(w){
  const x=String(w||"").toLowerCase().replace(/[.]/g,"");
  for(const u of S.cfg.units){ if(u.code.toLowerCase()===x || (u.hi && u.hi===w)) return u.code; }
  for(const [code,al] of Object.entries(UNIT_ALIASES)){ if(al.includes(x)||al.includes(w)) { const u=S.cfg.units.find(z=>z.code===code); return u?u.code:code; } }
  return null;
}
function candidates(text,n=20){
  const qt=phonTokens(text).filter(x=>x.length>=3 && !/^\d+$/.test(x));
  if(!qt.length) return [];
  return S.index.map(e=>{ let s=0; for(const q of qt){ const v=tokScore(q,e.toks); if(v>=50) s+=v; } return {it:e.it,s}; })
    .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.it);
}
function bestMatch(name){
  const d=findDup(name); if(d) return d;
  const qt=phonTokens(name).filter(x=>!/^\d+$/.test(x)); if(!qt.length) return null;
  let best=null, bs=0;
  for(const e of S.index){ let s=0, ok=true; for(const q of qt){ const v=tokScore(q,e.toks); if(v<50){ ok=false; break; } s+=v; }
    if(ok){ const cover=qt.length/Math.max(e.toks.length,1); s*=cover; if(s>bs){ bs=s; best=e.it; } } }
  return bs>=60 ? best : null;
}
function parseOne(src){
  let s=" "+devDigits(src).replace(/\s+/g," ").trim()+" ";
  if(!s.trim()) return null;
  let op = RE_DEL.test(s) ? "delete" : RE_ADD.test(s) ? "add" : RE_UPD.test(s) ? "update" : null;
  const num="(\\d+(?:\\.\\d+)?)";
  let buy=null, sell=null, pct=null, unit=null;
  const mPct=s.match(new RegExp(num+"\\s*(%|percent|pratishat|प्रतिशत|फ़ीसदी|फीसदी)","i"));
  if(mPct){ pct=+mPct[1]; if(RE_DOWN.test(s)) pct=-pct; s=s.replace(mPct[0]," "); }
  const mBuy=s.match(new RegExp("(?:buy(?:ing)?|purchase|cost|kharid|khareed|ख़रीद|खरीद|लागत)[^\\d]{0,14}?"+num,"i"));
  const mSell=s.match(new RegExp("(?:sell(?:ing)?|sale|bikri|bechne|बिक्री|बेच|mrp)[^\\d]{0,14}?"+num,"i"));
  if(mBuy) buy=+mBuy[1]; if(mSell) sell=+mSell[1];
  const mUnit=s.match(/(?:\bper\b|\/|प्रति|\bunit\b|इकाई|\bfi\b)\s*([a-zऀ-ॿ.]+)/i);
  if(mUnit){ unit=unitFromWord(mUnit[1]); s=s.replace(mUnit[0]," "); }
  // name part: before first rate keyword
  const kw=/\b(with|rates?|price|prices|rs|inr|at|for|buy(?:ing)?|purchase|cost|sell(?:ing)?|sale|mrp|kharid|khareed|bikri|bhav|daam|to|by)\b|₹|@|रेट|भाव|दाम|ख़रीद|खरीद|बिक्री|लागत|का रेट|की रेट|से/i;
  const km=s.match(kw);
  let namePart = km ? s.slice(0,km.index) : s;
  let ratePart = km ? s.slice(km.index) : "";
  if(!km){ const mTail=s.match(/(\s+\d+(?:\.\d+)?(?:\s*(?:,|and|aur|और|&)?\s+\d+(?:\.\d+)?)*)\s*(?:rs|rupees?|रुपये|रुपए)?\s*$/i); if(mTail){ namePart=s.slice(0,mTail.index); ratePart=mTail[1]; } }
  namePart = namePart.replace(RE_VERBWORD," ").replace(new RegExp(RE_ADD.source,"gi")," ").replace(new RegExp(RE_UPD.source,"gi")," ").replace(new RegExp(RE_DEL.source,"gi")," ")
    .replace(/\b(the|item|product|of|please|ka|ki|ke|ko|ek|aur|and|price|rate|do|de|dena|by|increase|decrease|raise|reduce|kam|badha|ghata)\b|(?:^|\s)(?:का|की|के|को|एक|आइटम|सामान|दो|दें|देना|और|कम)(?=\s|$)/gi," ")
    .replace(new RegExp("(?:\\bper\\b|/|प्रति)\\s*[a-z\\u0900-\\u097F.]+","gi")," ").replace(/[,;:।]+/g," ").replace(/\s+/g," ").trim();
  const nums=(ratePart.replace(mBuy?mBuy[0]:"\u0000"," ").replace(mSell?mSell[0]:"\u0000"," ").match(/\d+(?:\.\d+)?/g)||[]).map(Number);
  if(buy==null && sell==null && !pct){ if(nums.length>=2){ buy=nums[0]; sell=nums[1]; } else if(nums.length===1){ sell=nums[0]; } }
  else if(buy!=null && sell==null && nums.length) sell=nums[0];
  else if(sell!=null && buy==null && nums.length) buy=nums[0];
  if(!namePart) return null;
  const match=bestMatch(namePart);
  if(!op) op = match ? "update" : "add";
  if(op==="add" && match){ op="update"; }
  if(op!=="add" && !match){ if(op==="delete") return null; op="add"; }
  const name = op==="add" ? titleCase(namePart) : match.name;
  if(op==="update" && pct!=null){ const f=x=>roundPrice(x*(1+pct/100)); if(buy==null) buy=f(match.buy); if(sell==null) sell=f(match.sell); }
  if(op==="add" && sell==null) return { op, id:null, name, nameHi:"", unit:unit||S.cfg.defaultUnit, buy, sell:null };
  return { op, id: match?match.id:null, name, nameHi: match?match.nameHi:"", unit: unit || (match?match.unit:S.cfg.defaultUnit), buy, sell };
}
function titleCase(s){ return s.replace(/(^|\s)([a-z])/g,(m,a,b)=>a+b.toUpperCase()); }
function roundPrice(n){ const r=+S.cfg.roundTo; if(r===1) return Math.round(n); if(r===0.5) return Math.round(n*2)/2; return Math.round(n*100)/100; }
/* Spoken commands arrive as one long line. Split it where one complete change ends and the next begins,
   e.g. "add 51 micron bag 1kg rates 110 and 120 चीनी 5% बढ़ा दो" → two changes. */
const SPLIT_TAIL=/^\s*(?:(?:%|percent|pratishat|प्रतिशत|rs\.?|rupees?|रुपये|रुपए|रुपया|kam|badha|badhao|ghata|ghatao|kar|karo|do|de|dena|please|कम|बढ़ा|बढ़ा|बढा|घटा|कर|करो|करें|दो|दें|दीजिए)(?=\s|$)\s*)+/i;
function completeAct(a){ return !!a && (a.op==="delete" || a.sell!=null || a.buy!=null); }
function splitCommands(line){
  const out=[]; let rest=line.trim(), guard=0;
  const okRight=b=>completeAct(b) && !(b.op==="add" && !RE_ADD.test(b._src||""));
  while(rest && guard++<25){
    const cands=[];
    // after a rate: "…120 | चीनी 5% बढ़ा दो"
    const re=/\d+(?:\.\d+)?/g; let m;
    while((m=re.exec(rest))){
      let end=m.index+m[0].length;
      if(/[a-zऀ-ॿ]/i.test(rest[end]||"")) continue;          // "1kg": part of a name
      const tail=rest.slice(end).match(SPLIT_TAIL); if(tail) end+=tail[0].length;
      const pu=rest.slice(end).match(/^\s*(?:per\s+|प्रति\s*|\/\s*)?([a-zऀ-ॿ.]+)/i); if(pu && unitFromWord(pu[1])) end+=pu[0].length;
      cands.push(end);
    }
    // before an English verb that starts a new change: "delete maida | add besan …"
    const rv=/\s(add|delete|remove|update|change|set|increase|decrease|reduce)\b/gi; let v;
    while((v=rv.exec(rest))) cands.push(v.index+1);
    cands.sort((a,b)=>a-b);
    let cut=-1;
    for(const end of cands){
      const left=rest.slice(0,end).trim(), right=rest.slice(end).trim();
      if(!left||!right) continue;
      if(/^(?:,|and|aur|और|&|\+|\/|-|to|se|से)?\s*\d/i.test(right)) continue;   // "110 and 120"
      const a=parseOne(left), b=parseOne(right); if(b) b._src=right;
      if(completeAct(a) && okRight(b)){ cut=end; break; }
    }
    if(cut<0){ out.push(rest); break; }
    out.push(rest.slice(0,cut).trim()); rest=rest.slice(cut).trim();
  }
  return out;
}
function localParse(text){ return devDigits(text).split(/\n|;|\.\s|।|\b(?:and then|phir|fir)\b|फिर/i).map(x=>x.trim()).filter(Boolean).flatMap(splitCommands).map(parseOne).filter(Boolean); }

const HI_CONS=[["ksh","क्ष"],["chh","छ"],["sch","स्क"],["tch","च"],["sh","श"],["ch","च"],["th","थ"],["dh","ध"],["ph","फ़"],["bh","भ"],["gh","घ"],["kh","ख"],["jh","झ"],["ck","क"],["qu","क्व"],["wh","व"],["gn","न"],
  ["b","ब"],["c","क"],["d","ड"],["f","फ़"],["g","ग"],["h","ह"],["j","ज"],["k","क"],["l","ल"],["m","म"],["n","न"],["p","प"],["q","क"],["r","र"],["s","स"],["t","ट"],["v","व"],["w","व"],["x","क्स"],["y","य"],["z","ज़"]];
const HI_VOW_IND={"a":"अ","aa":"आ","e":"ए","ee":"ई","ea":"ई","i":"इ","ie":"आई","o":"ओ","oo":"ऊ","ou":"आउ","ow":"ओ","u":"अ","ai":"ए","ay":"ए","au":"ऑ","oa":"ओ","oi":"ऑय","oy":"ऑय"};
const HI_VOW_MAT={"a":"","aa":"ा","e":"े","ee":"ी","ea":"ी","i":"ि","ie":"ाइ","o":"ो","oo":"ू","ou":"ाउ","ow":"ो","u":"","ai":"े","ay":"े","au":"ॉ","oa":"ो","oi":"ॉय","oy":"ॉय","ar":"ा"};
const isV=ch=>"aeiou".includes(ch);
function hiWordRules(w){
  // w: lowercase letters only
  let out="", i=0, prevCons=false;
  const n=w.length;
  const vowelCount=(w.match(/[aeiouy]+/g)||[]).length;
  while(i<n){
    const rest=w.slice(i);
    // vowels
    if(isV(w[i]) || (w[i]==="y" && i>0 && !isV(w[i-1]) && (i===n-1 || !isV(w[i+1])))){
      let v;
      if(w[i]==="y"){ v = i===n-1 ? "ee" : "i"; i++; }
      else {
        const two=rest.slice(0,2);
        if(["aa","ee","ea","oo","ou","ow","ai","ay","au","oa","oi","oy","ie"].includes(two) && !(two==="ie" && i+2<n)){ v=two; i+=2; }
        else { v=w[i]; i++;
          // silent final e after a consonant (magic e): lengthen previous vowel handled below
          if(v==="e" && i===n && prevCons && vowelCount>1){ break; }
          const nextC=w.slice(i).match(/^[^aeiouy]+/); const after=nextC? w.slice(i+nextC[0].length):"";
          if(v==="u" && i===n){ v="oo"; }
          else if(v==="i" && i===n){ v="ee"; }
          else if(v==="a"){
            if(i===n) v="aa";                                   // final a
            else if(nextC && nextC[0][0]==="r" && (nextC[0].length>1 || !after)) v="ar";   // car, card, star
            else if(nextC && nextC[0].length===1 && after==="e") v="e";   // tape, cake, plate
            else if(vowelCount===1) v="ae";                     // bag, max, pack
          } else if(v==="i"){
            if(nextC && nextC[0].length===1 && after==="e") v="ie";   // wire, pipe, size
          } else if(v==="o"){
            if(nextC && nextC[0].length===1 && after==="e") v="o";    // drone, rope
            else if(vowelCount===1 && nextC) v="au";            // box, lock, pot
          } else if(v==="u"){
            if(nextC && nextC[0].length===1 && after==="e") v="oo";   // tube, jute
          }
        }
      }
      const ind = v==="ae" ? "ऐ" : (HI_VOW_IND[v]||"अ");
      const mat = v==="ae" ? "ै" : (HI_VOW_MAT[v]??"");
      if(prevCons){ if(out.endsWith("्")) out=out.slice(0,-1); out+=mat; } else out+=ind;
      prevCons=false; continue;
    }
    // consonants
    let hit=null;
    for(const [k,val] of HI_CONS){ if(rest.startsWith(k)){ hit=[k,val]; break; } }
    if(!hit){ i++; continue; }
    let [k,val]=hit;
    // soft c / g before e,i,y
    if(k==="c" && /^[eiy]/.test(w.slice(i+1))) val="स";
    if(k==="g" && /^[eiy]/.test(w.slice(i+1)) && i>0) val="ज";
    // doubled consonant → one sound
    if(k.length===1 && w[i+1]===k){ if(/[aiuo]$/.test(w)) { out+=val+"्"; } i++; }
    if(prevCons) out+="";                         // previous already has virama
    out+=val+"्"; prevCons=true; i+=k.length;
  }
  if(out.endsWith("्")) out=out.slice(0,-1);    // final consonant keeps no virama (schwa dropped when read)
  return out;
}
function toHindi(name){
  const src=String(name||"").trim(); if(!src) return "";
  if(/[ऀ-ॿ]/.test(src) && !/[A-Za-z]/.test(src)) return src;      // already Hindi
  const toks=src.split(/(\s+|[,/()+&-])/);
  const words=toks.filter(x=>x && !/^\s+$/.test(x));
  return toks.map((tok,ti)=>{
    if(!tok || /^\s+$/.test(tok) || /^[,/()+&-]$/.test(tok)) return tok;
    // split leading/trailing digits from letters: "1kg" → "1" "kg", "200gsm"
    const m=tok.match(/^(\d+(?:\.\d+)?)([A-Za-z]+)\.?$/);
    if(m) return m[1]+" "+hiToken(m[2],tok);
    return hiToken(tok,tok,toks,ti);
  }).join("").replace(/\s+/g," ").trim();
}
function hiToken(tok,orig,toks,ti){
  if(/^[\d.]+$/.test(tok)) return tok;                                   // numbers stay
  if(/^\d+(\.\d+)?[x*]\d+(\.\d+)?$/i.test(tok)) return tok.replace(/\*/,"x");   // 12x18
  if(/[ऀ-ॿ]/.test(tok)) return tok;
  if(tok==="x"||tok==="X"||tok==="*") return "x";                        // 27 x 30
  const clean=tok.replace(/[^A-Za-z]/g,""); if(!clean) return tok;
  const low=clean.toLowerCase();
  if(low==="no" && /\.$/.test(tok)) return "नंबर";
  if(HI_WORDS[low]) return HI_WORDS[low];
  const isCaps = clean===clean.toUpperCase() && clean.length>1;
  if(HI_ACRONYMS.has(low) || (isCaps && clean.length<=4 && !/[aeiou]/i.test(clean.slice(1))) || !/[aeiouy]/.test(low))
    return [...low].map(c=>HI_LETTERS[c]||"").join("");
  // plural s on a known word: "drones" → ड्रोन्स
  if(low.endsWith("s") && HI_WORDS[low.slice(0,-1)]) return HI_WORDS[low.slice(0,-1)]+"्स";
  return hiWordRules(low);
}

  if(S.pay==="credit") return {mode:"credit",recv:0,due:total};
  if(S.pay==="part"){ const r=toNum(S.recv); const v=isNaN(r)?0:Math.max(0,r); return {mode:"part",recv:v,due:r2(Math.max(0,total-v))}; }

  $("#cust").classList.toggle("need",!nameOk); $("#cust-mob").classList.toggle("need",!mobOk);

  return true;
}
/* Financial year (April–March). GST invoices can restart from 1 each April (setting, on by default). */
function curFY(d){ d=d?new Date(d):new Date(); const y=d.getFullYear(), m=d.getMonth()+1, st=m>=4?y:y-1; return st+"-"+String(st+1).slice(2); }
const fyShort=fy=>String(fy||"").replace(/^20(\d\d)-(\d\d)$/,"$1-$2");

function seriesNext(gst){ const raw=Math.max(1, Math.floor(+(gst?S.cfg.nextGstBill:S.cfg.nextBill))||1);
  if(gst && fyOn()){ const k=S.cfg.mode==="test"?S.cfg.testGstFy:S.cfg.gstFy; if(k && k!==curFY()) return 1; } return raw; }

/** Indian-style amount in words, e.g. 1,25,430.50 → "Rupees One Lakh Twenty Five Thousand Four Hundred Thirty and Fifty Paise Only". */
function inWords(amount){
  const ones=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const tens=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=n=>n<20?ones[n]:tens[Math.floor(n/10)]+(n%10?" "+ones[n%10]:"");
  const three=n=>{ const h=Math.floor(n/100), r=n%100; return (h?ones[h]+" Hundred"+(r?" ":""):"")+(r?two(r):""); };
  const words=n=>{ if(!n) return "Zero"; const out=[]; const cr=Math.floor(n/1e7); n%=1e7; const l=Math.floor(n/1e5); n%=1e5; const th=Math.floor(n/1000); n%=1000;
    if(cr) out.push(words(cr)+" Crore"); if(l) out.push(two(l)+" Lakh"); if(th) out.push(two(th)+" Thousand"); if(n) out.push(three(n)); return out.join(" "); };
  const neg=amount<0, paiseAll=Math.round(Math.abs(+amount||0)*100), r=Math.floor(paiseAll/100), p=paiseAll%100;

  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000); return "downloaded";

const isoDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function rpRange(k){
  const now=new Date(), d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const fyStart=y=>new Date(y,3,1), fyy=now.getMonth()>=3?now.getFullYear():now.getFullYear()-1;
  if(k==="today") return [isoDay(d),isoDay(d)];
  if(k==="yest"){ const y=new Date(d); y.setDate(d.getDate()-1); return [isoDay(y),isoDay(y)]; }
  if(k==="week"){ const s=new Date(d); s.setDate(d.getDate()-((d.getDay()+6)%7)); return [isoDay(s),isoDay(d)]; }
  if(k==="month") return [isoDay(new Date(d.getFullYear(),d.getMonth(),1)),isoDay(d)];
  if(k==="lastMonth") return [isoDay(new Date(d.getFullYear(),d.getMonth()-1,1)),isoDay(new Date(d.getFullYear(),d.getMonth(),0))];
  if(k==="fy") return [isoDay(fyStart(fyy)),isoDay(d)];
  if(k==="lastFy") return [isoDay(fyStart(fyy-1)),isoDay(new Date(fyy,2,31))];
  return null;
}
